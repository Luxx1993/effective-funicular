<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Clawd</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 240px; height: 282px; display: block; touch-action: none;
           -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c" width="240" height="282"></canvas>
<script>
'use strict';
const APP_VERSION = '0.1.0';
const KEY = 'clawd:state';          // namespaced: all creations share one origin
const W = 240, H = 282;
const MENU_Y = 232;                 // menu bar starts here
const FLOOR = 168;                  // wall/floor boundary
const FEET = 216;                   // Clawd's feet line

const cv = document.getElementById('c');
const DPR = Math.min(2, Math.max(1, Math.round(window.devicePixelRatio || 1)));
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext('2d');
ctx.scale(DPR, DPR);

const C = { body: '#D97757', shade: '#B9593A', eye: '#1b1210', blush: '#F4A58A', tear: '#7fc4f0' };
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- pixel sprites ----------
function sprite(map, pal, x, y, s) {
  for (let r = 0; r < map.length; r++)
    for (let c = 0; c < map[r].length; c++) {
      const ch = map[r][c];
      if (ch !== '.') rect(x + c * s, y + r * s, s, s, pal[ch]);
    }
}
const ICON = {
  feed:  { pal: { c: '#E8B64C', d: '#8a5a1e' },
           map: ['..cccc..', '.ccdccc.', 'cccccdcc', 'cdcccccc', 'ccccdccc', 'ccdccccc', '.cccccc.', '..cccc..'] },
  play:  { pal: { t: '#33b5b0', w: '#d9fffb', d: '#1b7471' },
           map: ['..tttt..', '.ttwwtt.', 'ttwttttt', 'twtttttt', 'ttttttdt', 'tttttddt', '.tttddt.', '..tttt..'] },
  sleep: { pal: { m: '#cfd8ff' },
           map: ['..mmmm..', '.mmm....', 'mmm.....', 'mmm.....', 'mmm.....', 'mmmm....', '.mmmmmm.', '..mmmm..'] },
  wake:  { pal: { y: '#ffd24a' },
           map: ['...y....', '.y.y.y..', '..yyy...', 'yyyyyyy.', '..yyy...', '.y.y.y..', '...y....', '........'] },
  clean: { pal: { h: '#a8743c', b: '#e8d27a' },
           map: ['......hh', '.....hh.', '....hh..', '...hh...', '..bbbb..', '.bbbbbb.', 'bbbbbbbb', 'b.b.b.b.'] },
  heart: { pal: { r: '#ff5c7a' }, map: ['.r.r.', 'rrrrr', 'rrrrr', '.rrr.', '..r..'] },
};
const spr = (name, x, y, s) => sprite(ICON[name].map, ICON[name].pal, x, y, s);

// ---------- state ----------
const S = { hunger: 70, fun: 70, energy: 80, clean: 80, xp: 0, born: Date.now(), last: Date.now() };
let ready = false;
const R = {
  x: 120, ox: 0, look: 0, mode: 'idle', t: 0, wait: 2, target: 120, leg: 0,
  blink: 0, nextBlink: 2.5, hop: 0, squash: 0, time: 0, happy: 0,
  hold: false, touchPet: false, sleeping: false, sel: 0, lastClick: 0,
  bugs: [], P: [], say: null, dim: 0, evolved: false, petHeart: 0, petXp: 0,
  careT: 0, jerk: 0, prev: null, shakeCool: 0, night: false, storageTag: '?',
};
const STAGES = ['Baby-Clawd', 'Clawd', 'Mega-Clawd'];
const XP_AT = [0, 150, 500];
const stage = () => (S.xp >= XP_AT[2] ? 2 : S.xp >= XP_AT[1] ? 1 : 0);
const px = () => [4, 5, 6][stage()];
const petting = () => (R.hold || R.touchPet) && !R.sleeping && (R.mode === 'idle' || R.mode === 'walk');

function mood() {
  const m = Math.min(S.hunger, S.fun, S.energy, S.clean);
  const a = (S.hunger + S.fun + S.energy + S.clean) / 4;
  return m < 25 ? 'sad' : a > 70 ? 'happy' : 'ok';
}
function setMode(m, data) { R.mode = m; R.t = 0; Object.assign(R, data || {}); }
function idle(w) { setMode('idle', { wait: w == null ? rnd(1.5, 4) : w }); }
function say(text, dur) { R.say = { text, t: 0, dur: dur || 2 }; }
function gainXp(n) {
  const old = stage();
  S.xp += n;
  if (stage() > old) R.evolved = true;
}
function endAction(happyFor) {
  R.happy = happyFor || 0;
  if (R.evolved) { R.evolved = false; cheer(); } else idle(1.5);
}
function cheer() {
  setMode('cheer');
  say('Level up!', 2.2);
  for (let i = 0; i < 30; i++)
    R.P.push({ kind: 'rect', x: R.x, y: FEET - 30, vx: rnd(-70, 70), vy: rnd(-150, -40), g: 220, life: rnd(1, 1.8),
               s: 3, col: ['#ffd24a', '#ff5c7a', '#33b5b0', '#fff', '#D97757'][i % 5] });
}
function wake(grumpy) {
  R.sleeping = false; R.happy = 0;
  idle(1.5);
  say(grumpy ? 'Hey! Ich schlief!' : S.energy < 40 ? 'Noch müde…' : 'Guten Morgen!', 2);
}

const QUIPS = ['git push!', 'Kompiliert!', 'Kein Bug :)', 'npm i …', 'Ship it!', 'Mehr Tokens?', 'Hallo!', 'Tests grün!'];
function quip() {
  if (S.hunger < 30) return say('Hunger…');
  if (S.energy < 25) return say('So müde…');
  if (S.fun < 30) return say('Spiel mit mir!');
  if (S.clean < 40) return say('Bugs überall!');
  say(QUIPS[Math.floor(Math.random() * QUIPS.length)]);
}

// ---------- actions ----------
function act(i) {
  if (!ready) return;
  if (R.sleeping) return wake(false);
  if (R.mode !== 'idle' && R.mode !== 'walk') return;
  if (i === 0) {
    if (S.hunger >= 92) { setMode('refuse'); say('Satt!', 1.2); }
    else setMode('eat', { bites: 0 });
  } else if (i === 1) {
    if (S.energy < 15) { setMode('refuse'); say('Zu müde…', 1.2); }
    else setMode('play', { bounces: 0, cx: clamp(R.x, 70, 170) });
  } else if (i === 2) {
    R.sleeping = true; setMode('sleep'); say('Gute Nacht…');
  } else {
    setMode('clean', { sweep: -10 });
    if (S.clean >= 95) say('Schon sauber!', 1.3);
  }
  saveSoon();
}

// ---------- update ----------
function decay(dt) {
  const z = R.sleeping;
  S.hunger -= (z ? 0.008 : 0.016) * dt;
  S.fun -= (z ? 0.004 : 0.014) * dt;
  S.clean -= (z ? 0.004 : 0.011) * dt;
  S.energy += (z ? 0.6 : -0.010) * dt;
  for (const k of ['hunger', 'fun', 'energy', 'clean']) S[k] = clamp(S[k], 0, 100);
  R.careT += dt;
  if (R.careT >= 60) { R.careT = 0; if (Math.min(S.hunger, S.fun, S.energy, S.clean) >= 40) gainXp(1); }
}
function bugTarget() { return S.clean < 75 ? Math.min(4, Math.ceil((75 - S.clean) / 19)) : 0; }
function syncBugs() {
  const n = bugTarget();
  while (R.bugs.length < n)
    R.bugs.push({ x: rnd(20, 220), y: rnd(190, 228), dir: Math.random() < .5 ? -1 : 1, v: rnd(5, 12), ph: 0 });
  while (R.bugs.length > n) puff(R.bugs.shift());
}
function puff(b) {
  for (let i = 0; i < 6; i++)
    R.P.push({ kind: 'rect', x: b.x + 6, y: b.y + 4, vx: rnd(-40, 40), vy: rnd(-50, -5), g: 120, life: .5, s: 2, col: '#7fe07f' });
}

function update(dt) {
  R.time += dt; R.t += dt; R.ox = 0; R.hop = 0; R.squash = 0;
  R.dim += ((R.sleeping ? 0.55 : 0) - R.dim) * Math.min(1, dt * 3);
  if (R.say) { R.say.t += dt; if (R.say.t > R.say.dur) R.say = null; }
  if (R.happy > 0) R.happy -= dt;
  R.nextBlink -= dt;
  if (R.nextBlink <= 0) { R.blink = .12; R.nextBlink = rnd(2, 5); }
  if (R.blink > 0) R.blink -= dt;
  R.shakeCool -= dt; R.jerk *= 0.9;

  R.P = R.P.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; return (p.life -= dt) > 0; });
  for (const b of R.bugs) {
    b.ph += dt * 6; b.x += b.dir * b.v * dt;
    if (b.x < 10 || b.x > 218) b.dir = -b.dir;
    if (Math.random() < dt * .3) b.dir = -b.dir;
  }
  if (!ready) return;
  decay(dt);
  if (Math.floor(R.time) !== Math.floor(R.time - dt)) syncBugs();

  const m = R.mode, p = px();
  if (m === 'idle' || m === 'walk') {
    if (R.evolved) { R.evolved = false; return cheer(); }
    if (S.energy <= 2) { R.sleeping = true; setMode('sleep'); say('zZz…'); return; }
    if (petting()) {
      if (m === 'walk') idle(1);
      S.fun = Math.min(100, S.fun + 4 * dt);
      R.petHeart -= dt; R.petXp += dt;
      if (R.petHeart <= 0) {
        R.petHeart = .4;
        R.P.push({ kind: 'heart', x: R.x + rnd(-14, 14), y: FEET - 8 * p - 6, vx: rnd(-8, 8), vy: -28, life: 1.2 });
      }
      if (R.petXp >= 4) { R.petXp = 0; gainXp(1); }
      return;
    }
  }
  if (m === 'idle') {
    R.look *= 0.9;
    R.wait -= dt;
    if (R.wait <= 0) {
      if (Math.random() < .4) quip();
      R.target = rnd(36, 204);
      setMode('walk');
    }
  } else if (m === 'walk') {
    const d = R.target - R.x, sp = mood() === 'sad' ? 13 : 22;
    R.look = Math.sign(d);
    R.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt);
    R.leg += dt * 8;
    if (Math.abs(d) < 1.5) idle();
  } else if (m === 'eat') {
    const t = R.t, b = t < .7 ? 0 : Math.floor((t - .7) / .4) + 1;
    if (b > R.bites && b <= 4) {
      R.bites = b; S.hunger = Math.min(100, S.hunger + 8);
      for (let i = 0; i < 4; i++)
        R.P.push({ kind: 'rect', x: R.x, y: FEET - 8 * p + 3 * p, vx: rnd(-35, 35), vy: rnd(-40, -5), g: 160, life: .5, s: 2, col: '#E8B64C' });
    }
    if (t > 2.5) { gainXp(4); say('Lecker!'); endAction(1.5); }
  } else if (m === 'play') {
    const T = .7, u = (R.t % T) / T, n = Math.floor(R.t / T);
    if (n > R.bounces) { R.bounces = n; S.fun = Math.min(100, S.fun + 7); gainXp(1); }
    const nx = clamp(R.cx + Math.sin(R.t * 1.5) * 35, 30, 210);
    R.look = Math.sign(nx - R.x); R.x = nx; R.leg += dt * 8;
    R.squash = (u < .1 || u > .92) ? 1 : 0;
    if (R.t >= 4.2) {
      S.energy = Math.max(0, S.energy - 8); S.hunger = Math.max(0, S.hunger - 4);
      gainXp(4); say('Das war toll!'); endAction(1.5);
    }
  } else if (m === 'clean') {
    R.sweep = -10 + R.t / 1.3 * (W + 20);
    R.hop = Math.abs(Math.sin(R.t * 8)) * 8;
    for (let i = R.bugs.length - 1; i >= 0; i--)
      if (R.bugs[i].x < R.sweep) { puff(R.bugs[i]); R.bugs.splice(i, 1); }
    for (let i = 0; i < 2; i++)
      R.P.push({ kind: 'rect', x: R.sweep, y: rnd(FLOOR + 6, MENU_Y - 4), vx: -20, vy: rnd(-20, 0), life: .5, s: 2, col: Math.random() < .5 ? '#fff' : '#9fe3ff' });
    if (R.t > 1.5) { S.clean = Math.min(100, S.clean + 55); gainXp(5); say('Sauber!'); syncBugs(); endAction(1.5); }
  } else if (m === 'sleep') {
    R.hop = 0;
    if (Math.floor(R.t) !== Math.floor(R.t - dt))
      R.P.push({ kind: 'text', text: 'z', s: 10 + Math.floor(Math.random() * 6), x: R.x + 8 * p * .6, y: FEET - 8 * p, vx: 8, vy: -14, life: 2, col: '#cfd8ff' });
    if (S.energy >= 100) { gainXp(3); wake(false); }
  } else if (m === 'dizzy') {
    R.ox = Math.sin(R.t * 12) * 3;
    if (R.t > 1.6) { say('Uff… schwindlig'); idle(1.5); }
  } else if (m === 'refuse') {
    R.ox = Math.sin(R.t * 30) * 2 * (1 - R.t / 1.2);
    if (R.t > 1.2) idle(1);
  } else if (m === 'cheer') {
    R.hop = Math.abs(Math.sin(R.t * 7)) * 14;
    if (R.t > 2.2) idle(1);
  }
}

// ---------- drawing ----------
function makeBG(night) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const f = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  f(0, 0, W, FLOOR, night ? '#1d2036' : '#34395a');
  for (let x = 0; x < W; x += 24) f(x, 0, 12, FLOOR, night ? '#191c2f' : '#2e3352');
  f(0, FLOOR - 6, W, 6, night ? '#0f1120' : '#202440');
  f(0, FLOOR, W, H - FLOOR, night ? '#4a3425' : '#7a5538');
  for (let y = FLOOR + 14, row = 0; y < H; y += 14, row++) {
    f(0, y, W, 2, night ? '#3b291d' : '#664529');
    for (let x = (row % 2) * 30; x < W; x += 60) f(x, y - 14 + 2, 2, 12, night ? '#3b291d' : '#664529');
  }
  // window
  f(166, 74, 56, 46, '#6b4a33');
  f(170, 78, 48, 38, night ? '#0b1030' : '#7fc4f0');
  if (night) {
    f(200, 84, 8, 8, '#fff6c8'); f(203, 84, 5, 6, '#0b1030');
    [[176, 84], [186, 96], [178, 106], [208, 104], [194, 82]].forEach(([x, y]) => f(x, y, 2, 2, '#fff'));
  } else {
    f(198, 82, 12, 12, '#ffd24a'); f(196, 84, 16, 8, '#ffd24a');
    f(174, 100, 20, 6, '#fff'); f(180, 96, 12, 6, '#fff');
  }
  f(193, 78, 3, 38, '#6b4a33'); f(170, 95, 48, 3, '#6b4a33');
  f(162, 120, 64, 4, '#8a6244');
  // picture frame with </>
  f(20, 76, 46, 34, '#6b4a33'); f(24, 80, 38, 26, '#171a2b');
  g.fillStyle = '#D97757'; g.font = 'bold 14px monospace'; g.textBaseline = 'middle'; g.fillText('</>', 28, 94);
  // rug
  f(54, 196, 132, 26, '#8c3b46'); f(50, 200, 140, 18, '#8c3b46');
  f(58, 200, 124, 18, '#a8505c'); f(70, 204, 100, 10, '#8c3b46'); f(78, 207, 84, 4, '#d9a066');
  // plant
  f(14, 160, 4, 30, '#2f8f4a'); f(8, 168, 8, 4, '#3fb560'); f(18, 162, 10, 4, '#3fb560');
  f(6, 178, 10, 4, '#2f8f4a'); f(18, 174, 12, 4, '#3fb560');
  f(8, 190, 24, 5, '#c97b4a'); f(10, 195, 20, 16, '#b5653c');
  if (night) { g.globalAlpha = .25; f(0, 0, W, H, '#000'); g.globalAlpha = 1; }
  return c;
}
let BG = null, BGnight = null;
function refreshNight() { const h = new Date().getHours(); R.night = h < 7 || h >= 20; }

function pose() {
  const o = { eyes: 'open', mouth: 'none', aL: 2, aR: 2, blush: false, tear: false, walk: false };
  const m = R.mode, md = mood();
  if (R.sleeping || m === 'sleep') { o.eyes = 'closed'; o.mouth = Math.sin(R.time * 1.6) > 0 ? 'o' : 'none'; }
  else if (m === 'dizzy') { o.eyes = 'dizzy'; o.mouth = 'o'; o.aL = 0; o.aR = 1; }
  else if (m === 'refuse') { o.eyes = 'closed'; o.mouth = 'frown'; }
  else if (m === 'eat') {
    o.eyes = R.t > .7 ? 'happy' : 'open';
    o.mouth = (R.t > .7 && ((R.t - .7) % .4) < .2) ? 'open' : 'smile';
  } else if (m === 'play' || m === 'cheer' || m === 'clean') {
    o.eyes = 'happy'; o.mouth = 'smile'; o.blush = true;
    o.aL = o.aR = Math.sin(R.time * 14) > 0 ? 0 : 1;
    if (m === 'play') o.walk = true;
  } else if (petting()) { o.eyes = 'happy'; o.mouth = 'smile'; o.blush = true; }
  else if (R.happy > 0) { o.eyes = 'happy'; o.mouth = 'smile'; o.blush = true; }
  else {
    if (R.blink > 0) o.eyes = 'blink';
    o.mouth = md === 'happy' ? 'smile' : md === 'sad' ? 'frown' : 'none';
    o.tear = md === 'sad';
    if (m === 'walk') { o.walk = true; o.aL = Math.sin(R.leg) > 0 ? 2 : 3; o.aR = Math.sin(R.leg) > 0 ? 3 : 2; }
  }
  return o;
}

function drawClawd() {
  const p = px(), o = pose();
  const bob = (R.sleeping ? Math.round(Math.sin(R.time * 1.6)) : (R.mode === 'idle' ? Math.round(Math.sin(R.time * 2.2)) : 0));
  const sq = R.squash ? p : 0;
  const x0 = R.x + R.ox - 7.5 * p;
  const y0 = FEET - 8 * p - R.hop + bob + sq;
  const rc = (c, r, w, h, col) => rect(x0 + c * p, y0 + r * p, w * p, h * p, col);

  // shadow
  ctx.globalAlpha = .28;
  const sw = 11 * p * (1 - Math.min(R.hop, 40) / 120);
  rect(R.x + R.ox - sw / 2, FEET - 1, sw, Math.max(3, p), '#000');
  ctx.globalAlpha = 1;

  // legs
  const frame = Math.sin(R.leg) > 0;
  [3, 5, 9, 11].forEach((c, i) => {
    const lifted = o.walk && (i % 2 === (frame ? 0 : 1));
    rc(c, 6, 1, sq ? 1 : (lifted ? 1 : 2), C.body);
  });
  // body, arms
  rc(2, 0, 11, 6, C.body);
  rc(2, 5, 11, 1, C.shade);
  rc(0, o.aL, 2, 2, C.body);
  rc(13, o.aR, 2, 2, C.body);

  // eyes
  const s = R.look > .3 ? 1 : R.look < -.3 ? -1 : 0;
  if (o.eyes === 'open') { rc(4 + s, 2, 1, 2, C.eye); rc(10 + s, 2, 1, 2, C.eye); }
  else if (o.eyes === 'blink') { rc(4 + s, 3, 1, 1, C.eye); rc(10 + s, 3, 1, 1, C.eye); }
  else if (o.eyes === 'closed') { rc(3, 3, 3, 1, C.eye); rc(9, 3, 3, 1, C.eye); }
  else if (o.eyes === 'happy') {
    for (const b of [3, 9]) { rc(b, 3, 1, 1, C.eye); rc(b + 1, 2, 1, 1, C.eye); rc(b + 2, 3, 1, 1, C.eye); }
  } else if (o.eyes === 'dizzy') {
    for (const b of [3, 9]) { rc(b, 2, 1, 1, C.eye); rc(b + 2, 2, 1, 1, C.eye); rc(b + 1, 3, 1, 1, C.eye); rc(b, 4, 1, 1, C.eye); rc(b + 2, 4, 1, 1, C.eye); }
  }
  if (o.blush) { rc(2, 4, 2, 1, C.blush); rc(11, 4, 2, 1, C.blush); }
  if (o.tear) rc(4, 4 + (Math.floor(R.time * 2) % 2), 1, 1, C.tear);
  // mouth
  if (o.mouth === 'smile') { rc(6, 3, 1, 1, C.eye); rc(7, 4, 1, 1, C.eye); rc(8, 3, 1, 1, C.eye); }
  else if (o.mouth === 'frown') { rc(6, 4, 1, 1, C.eye); rc(7, 3, 1, 1, C.eye); rc(8, 4, 1, 1, C.eye); }
  else if (o.mouth === 'open') rc(6, 3, 3, 2, C.eye);
  else if (o.mouth === 'o') rc(7, 3, 1, 2, C.eye);

  // dizzy stars
  if (R.mode === 'dizzy')
    for (let i = 0; i < 3; i++) {
      const a = R.time * 5 + i * 2.1, sx = R.x + Math.cos(a) * 18, sy = y0 - 8 + Math.sin(a) * 5;
      rect(sx - 1, sy - 3, 2, 6, '#ffd24a'); rect(sx - 3, sy - 1, 6, 2, '#ffd24a');
    }
  return { x0, y0, p };
}

function drawBug(b) {
  const x = b.x, y = b.y, g = '#5fbf5f', gd = '#2f7f3f', f = b.dir > 0;
  const px_ = (o, w) => f ? x + o : x + 12 - o - w;
  rect(px_(1, 10), y + 2, 10, 5, g);
  rect(px_(9, 3), y + 3, 3, 3, gd);
  rect(px_(11, 1), y + 1, 1, 2, gd);
  const up = Math.floor(b.ph) % 2;
  for (let i = 0; i < 3; i++) rect(px_(2 + i * 3, 1), y + 7, 1, 2 + (i % 2 === up ? 1 : 0), gd);
}

function drawParticles() {
  for (const p of R.P) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    if (p.kind === 'heart') spr('heart', p.x - 5, p.y - 5, 2);
    else if (p.kind === 'text') { ctx.fillStyle = p.col; ctx.font = 'bold ' + p.s + 'px monospace'; ctx.textBaseline = 'middle'; ctx.fillText(p.text, p.x, p.y); }
    else rect(p.x, p.y, p.s, p.s, p.col);
  }
  ctx.globalAlpha = 1;
}

function drawBubble(c) {
  if (!R.say) return;
  ctx.font = 'bold 10px monospace'; ctx.textBaseline = 'middle';
  const w = Math.ceil(ctx.measureText(R.say.text).width) + 12, h = 16;
  const bx = clamp(R.x - w / 2, 3, W - w - 3), by = c.y0 - h - 12;
  rect(bx, by, w, h, '#fff'); rect(bx + 1, by - 1, w - 2, 1, '#fff'); rect(bx + 1, by + h, w - 2, 1, '#fff');
  rect(R.x - 3, by + h, 6, 3, '#fff'); rect(R.x - 1, by + h + 3, 2, 2, '#fff');
  ctx.fillStyle = C.eye; ctx.fillText(R.say.text, bx + 6, by + h / 2 + 1);
}

const barCol = v => v > 50 ? '#4cd964' : v > 25 ? '#ffcc00' : '#ff453a';
function drawHUD() {
  ctx.globalAlpha = .5; rect(0, 40, W, 34, '#000'); ctx.globalAlpha = 1;
  [['hunger', 'feed'], ['fun', 'play'], ['energy', 'sleep'], ['clean', 'clean']].forEach(([k, ic], i) => {
    const x = 4 + i * 58;
    spr(ic, x, 43, 1);
    rect(x + 11, 45, 40, 5, '#2a2a2a');
    rect(x + 11, 45, 40 * S[k] / 100, 5, barCol(S[k]));
  });
  const st = stage(), days = Math.floor((Date.now() - S.born) / 864e5) + 1;
  ctx.font = 'bold 9px monospace'; ctx.textBaseline = 'top'; ctx.fillStyle = '#e8e8e8';
  ctx.fillText(STAGES[st] + ' · Tag ' + days, 4, 57);
  ctx.fillStyle = '#777'; ctx.textAlign = 'right';
  ctx.fillText('v' + APP_VERSION + ' ' + R.storageTag, W - 4, 57); ctx.textAlign = 'left';
  const lo = XP_AT[st], hi = XP_AT[st + 1];
  rect(4, 69, W - 8, 2, '#2a2a2a');
  rect(4, 69, (W - 8) * (hi ? clamp((S.xp - lo) / (hi - lo), 0, 1) : 1), 2, '#D97757');
}

function drawMenu() {
  rect(0, MENU_Y, W, H - MENU_Y, '#141414'); rect(0, MENU_Y, W, 1, '#333');
  const busy = !R.sleeping && R.mode !== 'idle' && R.mode !== 'walk';
  const labels = ['Füttern', 'Spielen', R.sleeping ? 'Wecken' : 'Schlafen', 'Putzen'];
  const icons = ['feed', 'play', R.sleeping ? 'wake' : 'sleep', 'clean'];
  for (let i = 0; i < 4; i++) {
    const x = i * 60 + 2, y = MENU_Y + 3;
    if (i === R.sel) {
      rect(x, y, 56, 46, '#2a2a2a');
      rect(x, y, 56, 2, '#D97757'); rect(x, y + 44, 56, 2, '#D97757');
      rect(x, y, 2, 46, '#D97757'); rect(x + 54, y, 2, 46, '#D97757');
    }
    ctx.globalAlpha = busy ? .4 : 1;
    spr(icons[i], x + 16, y + 5, 3);
    ctx.font = 'bold 9px monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillStyle = i === R.sel ? '#fff' : '#aaa';
    ctx.fillText(labels[i], x + 28, y + 36);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

function draw() {
  if (BGnight !== R.night) { BG = makeBG(R.night); BGnight = R.night; }
  ctx.drawImage(BG, 0, 0, W, H);

  for (const b of R.bugs) if (b.y < FEET) drawBug(b);
  const c = drawClawd();
  for (const b of R.bugs) if (b.y >= FEET) drawBug(b);

  const p = c.p;
  if (R.mode === 'eat') {
    const t = R.t, b = t < .7 ? 0 : Math.floor((t - .7) / .4) + 1;
    if (b < 5) {
      const sc = [3, 3, 2, 2, 1][b], size = 8 * sc;
      const y = t < .7 ? 76 + (c.y0 + 2 * p - size / 2 - 76) * (t / .7) : c.y0 + 2 * p - size / 2;
      spr('feed', R.x - size / 2, y, sc);
    }
  } else if (R.mode === 'play') {
    const T = .7, u = (R.t % T) / T;
    spr('play', R.x - 8, c.y0 - 16 - Math.sin(Math.PI * u) * 58, 2);
  } else if (R.mode === 'clean') {
    rect(R.sweep, FLOOR, 3, MENU_Y - FLOOR, 'rgba(255,255,255,.7)');
  }
  drawParticles();
  drawBubble(c);

  if (R.dim > .01) { ctx.globalAlpha = R.dim; rect(0, 40, W, MENU_Y - 40, '#05060f'); ctx.globalAlpha = 1; }
  drawHUD();
  drawMenu();
  if (!ready) { rect(0, 150, W, 22, '#000'); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textBaseline = 'middle'; ctx.fillText('Lade…', 100, 161); }
}

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (ts - lastTs < 33) return;        // ~30 fps is plenty
  const dt = Math.min(.1, (ts - lastTs) / 1000); lastTs = ts;
  update(dt); draw();
}

// ---------- storage (Base64, UTF-8 safe, creationStorage first, localStorage mirror) ----------
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(get, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { const v = get(); if (v) return v; await sleepMs(100); }
  return get() || null;
}
let CS = null;
async function loadState() {
  // SDK objects arrive late on the device: poll up to 3 s there, hardly wait on desktop
  CS = await waitFor(() => window.creationStorage && window.creationStorage.plain, /Android/i.test(navigator.userAgent) ? 3000 : 250);
  R.storageTag = CS ? 'cs' : 'ls';
  let raw = null;
  try { if (CS) raw = await CS.getItem(KEY); } catch (e) {}
  if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
  if (raw) { try { return dec(raw); } catch (e) {} }
  return null;
}
let saveTimer = 0;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow() {
  if (!ready) return;
  S.last = Date.now();
  const s = enc(S);
  try { localStorage.setItem(KEY, s); } catch (e) {}
  try { if (CS) Promise.resolve(CS.setItem(KEY, s)).catch(() => {}); } catch (e) {}
}
setInterval(saveNow, 5000);
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

async function boot() {
  requestAnimationFrame(frame);
  const s = await loadState();
  refreshNight();
  if (s) {
    const num = (v, d) => (Number.isFinite(v) ? v : d);
    const el = clamp((Date.now() - num(s.last, Date.now())) / 1000, 0, 6 * 3600);
    // time away: slower decay, never below 15 so Clawd is only sad, never lost
    const off = (v, r) => Math.max(Math.min(v, 15), v - r * el * 0.6);
    S.hunger = off(clamp(num(s.hunger, 70), 0, 100), 0.016);
    S.fun = off(clamp(num(s.fun, 70), 0, 100), 0.014);
    S.clean = off(clamp(num(s.clean, 80), 0, 100), 0.011);
    S.energy = clamp(num(s.energy, 80), 0, 100);
    S.xp = Math.max(0, num(s.xp, 0));
    S.born = num(s.born, Date.now());
    say(el > 1800 ? 'Du warst lange weg!' : 'Hallo wieder!', 2.5);
  } else {
    say('Hallo, ich bin Clawd!', 3);
  }
  ready = true; syncBugs(); saveNow();
}

// ---------- input ----------
window.addEventListener('scrollUp', () => { R.sel = (R.sel + 3) % 4; });
window.addEventListener('scrollDown', () => { R.sel = (R.sel + 1) % 4; });
window.addEventListener('sideClick', () => {
  const n = performance.now();
  if (n - R.lastClick < 250) return;   // a double click arrives as two events ~50 ms apart
  R.lastClick = n; act(R.sel);
});
window.addEventListener('longPressStart', () => { R.hold = true; });
window.addEventListener('longPressEnd', () => { R.hold = false; });

function pos(e) {
  const t = (e.touches && e.touches[0]) || e, r = cv.getBoundingClientRect();
  return [(t.clientX - r.left) * W / r.width, (t.clientY - r.top) * H / r.height];
}
function down(e) {
  e.preventDefault();
  const [x, y] = pos(e);
  if (y >= MENU_Y) { R.sel = clamp(Math.floor(x / 60), 0, 3); act(R.sel); return; }
  const p = px();
  if (Math.abs(x - R.x) < 8 * p && y > FEET - 8 * p - 12 && y < FEET + 4) {
    if (R.sleeping) wake(true); else R.touchPet = true;
  }
}
function up(e) { e.preventDefault(); R.touchPet = false; }
document.body.addEventListener('touchstart', down, { passive: false });
document.body.addEventListener('touchend', up, { passive: false });
document.body.addEventListener('touchcancel', up, { passive: false });
document.body.addEventListener('mousedown', down);
document.body.addEventListener('mouseup', up);

// shake -> dizzy (wakes a sleeping Clawd, grumpily)
function onAccel(d) {
  const x = d.tiltX ?? d.x ?? 0, y = d.tiltY ?? d.y ?? 0, z = d.tiltZ ?? d.z ?? 0;
  if (R.prev) R.jerk += Math.abs(x - R.prev[0]) + Math.abs(y - R.prev[1]) + Math.abs(z - R.prev[2]);
  R.prev = [x, y, z];
  if (R.jerk > 2.5 && R.shakeCool <= 0 && ready) {
    R.shakeCool = 4; R.jerk = 0;
    if (R.sleeping) wake(true);
    else if (R.mode === 'idle' || R.mode === 'walk') { S.fun = Math.min(100, S.fun + 5); setMode('dizzy'); }
  }
}
(async function initSensors() {
  try {
    const acc = await waitFor(() => window.creationSensors && window.creationSensors.accelerometer, 3000);
    if (acc && await acc.isAvailable()) acc.start(onAccel, { frequency: 30 });
  } catch (e) {}
})();

// desktop preview shim: arrows = wheel, Enter/Space = side click, H = hold (pet)
if (typeof window.PluginMessageHandler === 'undefined') {
  const map = { ArrowUp: 'scrollUp', ArrowLeft: 'scrollUp', ArrowDown: 'scrollDown', ArrowRight: 'scrollDown', Enter: 'sideClick', ' ': 'sideClick' };
  window.addEventListener('keydown', e => {
    if (map[e.key]) { e.preventDefault(); window.dispatchEvent(new Event(map[e.key])); }
    else if ((e.key === 'h' || e.key === 'H') && !e.repeat) window.dispatchEvent(new Event('longPressStart'));
  });
  window.addEventListener('keyup', e => { if (e.key === 'h' || e.key === 'H') window.dispatchEvent(new Event('longPressEnd')); });
}

setInterval(refreshNight, 30000);
boot();
</script>
</body>
