<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Clawd</title>
<style>
  /*@FONT@*/
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 240px; height: 282px; display: block; touch-action: none;
           -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c" width="240" height="282"></canvas>
<script>
'use strict';
// Clawd, a tamagotchi diorama. Scenery, styles and Clawd's animations come from the
// Claude Fables plugin (baked to images by src/r1assets.ts).
const APP_VERSION = '0.2.0';
const KEY = 'clawd:state';          // namespaced: all creations share one origin
const MANI = /*@MANI@*/null;
const LOOKS = /*@LOOKS@*/null;
const W = 240, H = 282;
const MENU_Y = 232;                 // menu bar starts here
const TOP = 40;                     // the OS bar covers the top 40 px: the scene starts below
const SC = 1.5;                     // logical px per stage unit
const BGW = MANI.sw * SC, BGH = MANI.h * SC;   // 480 x 192
const K = SC / MANI.scale;          // asset px -> logical px
const CELLW = MANI.cw * MANI.scale, CELLH = MANI.ch * MANI.scale;
const SCENES = ['forest', 'space', 'city', 'desert', 'volcano', 'lab', 'night'];
const SCENE_DE = { forest: 'Wald', space: 'Weltraum', city: 'Stadt', desert: 'Wüste', volcano: 'Vulkan', lab: 'Labor', night: 'Dorf' };
const LOOK_DE = { pixel: 'Pixel Art', original: 'Original', cave: 'Höhle', blueprint: 'Blaupause', mosaic: 'Mosaik', aero: 'Frutiger Aero', engraving: 'Kupferstich', tapestry: 'Wandteppich', golden: 'Golden Age', ukiyoe: 'Ukiyo-e', kamon: 'Kamon' };
const FONT = 'Monocraft, ui-monospace, monospace';

const cv = document.getElementById('c');
const DPR = Math.min(2, Math.max(1, Math.round(window.devicePixelRatio || 1)));
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext('2d');
ctx.scale(DPR, DPR);

const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- small pixel icons (menu, food, ball, hearts) ----------
function sprite(map, pal, x, y, s) {
  for (let r = 0; r < map.length; r++)
    for (let c = 0; c < map[r].length; c++) {
      const ch = map[r][c];
      if (ch !== '.') rect(x + c * s, y + r * s, s, s, pal[ch]);
    }
}
const ICON = {
  feed:  { pal: { c: '#E8B64C', d: '#8a5a1e' },
           map: ['..cccc..', '.ccdccc.', 'cccccdcc', 'cdcccccc', 'ccccdccc', 'ccdccccc', '.cccccc.', '..cccc..'] },
  play:  { pal: { t: '#33b5b0', w: '#d9fffb', d: '#1b7471' },
           map: ['..tttt..', '.ttwwtt.', 'ttwttttt', 'twtttttt', 'ttttttdt', 'tttttddt', '.tttddt.', '..tttt..'] },
  sleep: { pal: { m: '#cfd8ff' },
           map: ['..mmmm..', '.mmm....', 'mmm.....', 'mmm.....', 'mmm.....', 'mmmm....', '.mmmmmm.', '..mmmm..'] },
  wake:  { pal: { y: '#ffd24a' },
           map: ['...y....', '.y.y.y..', '..yyy...', 'yyyyyyy.', '..yyy...', '.y.y.y..', '...y....', '........'] },
  clean: { pal: { h: '#a8743c', b: '#e8d27a' },
           map: ['......hh', '.....hh.', '....hh..', '...hh...', '..bbbb..', '.bbbbbb.', 'bbbbbbbb', 'b.b.b.b.'] },
  world: { pal: { m: '#8aa0b8', s: '#ffd24a', g: '#4cae5c' },
           map: ['......s.', '.....sss', '..m...s.', '.mmm....', 'mmmmm.m.', 'mmmmmmmm', 'gggggggg', 'gggggggg'] },
  heart: { pal: { r: '#ff5c7a' }, map: ['.r.r.', 'rrrrr', 'rrrrr', '.rrr.', '..r..'] },
};
const spr = (name, x, y, s) => sprite(ICON[name].map, ICON[name].pal, x, y, s);

// ---------- state ----------
const S = { hunger: 70, fun: 70, energy: 80, clean: 80, xp: 0, born: Date.now(), last: Date.now(), scene: 'forest', look: 'original' };
let ready = false;
const R = {
  x: 240, ox: 0, look: 1, mode: 'idle', t: 0, wait: 2, target: 240, hop: 0, time: 0, happy: 0, greet: 3,
  hold: false, touchPet: false, sleeping: false, sel: 0, lastClick: 0,
  bugs: [], P: [], say: null, dim: 0, evolved: false, petHeart: 0, petXp: 0,
  careT: 0, jerk: 0, prev: null, shakeCool: 0, storageTag: '?',
  bg: null, sheet: null, bgKey: '', sheetKey: '', anim: '', animT0: 0,
  panel: false, prow: 0, amb: [], ambScene: '',
};
const STAGES = ['Baby-Clawd', 'Clawd', 'Mega-Clawd'];
const XP_AT = [0, 150, 500];
const SIZE = [0.8, 1, 1.25];
const stage = () => (S.xp >= XP_AT[2] ? 2 : S.xp >= XP_AT[1] ? 1 : 0);
const sz = () => SIZE[stage()];
const lookInfo = () => LOOKS.find(l => l.name === S.look) || LOOKS[1];
const floorY = () => TOP + MANI.floors[S.scene] * SC;
const feetY = () => Math.min(floorY() + 12, MENU_Y - 6);
const camX = () => clamp(R.x - W / 2, 0, BGW - W);
const petting = () => (R.hold || R.touchPet) && !R.sleeping && (R.mode === 'idle' || R.mode === 'walk') && !R.panel;
const busyNow = () => !(R.mode === 'idle' || R.mode === 'walk');

function mood() {
  const m = Math.min(S.hunger, S.fun, S.energy, S.clean);
  const a = (S.hunger + S.fun + S.energy + S.clean) / 4;
  return m < 25 ? 'sad' : a > 70 ? 'happy' : 'ok';
}
function setMode(m, data) { R.mode = m; R.t = 0; Object.assign(R, data || {}); }
function idle(w) { setMode('idle', { wait: w == null ? rnd(1.5, 4) : w }); }
function say(text, dur) { R.say = { text, t: 0, dur: dur || 2 }; }
function gainXp(n) {
  const old = stage();
  S.xp += n;
  if (stage() > old) R.evolved = true;
}
function endAction(happyFor) {
  R.happy = happyFor || 0;
  if (R.evolved) { R.evolved = false; cheer(); } else idle(1.5);
}
function cheer() {
  setMode('cheer');
  say('Level up!', 2.2);
  const fy = feetY();
  for (let i = 0; i < 30; i++)
    R.P.push({ kind: 'rect', x: R.x, y: fy - 50, vx: rnd(-70, 70), vy: rnd(-150, -40), g: 220, life: rnd(1, 1.8),
               s: 3, col: ['#ffd24a', '#ff5c7a', '#33b5b0', '#fff', '#D97757'][i % 5] });
}
function wake(grumpy) {
  R.sleeping = false; R.happy = 0;
  idle(1.5);
  say(grumpy ? 'Hey! Ich schlief!' : S.energy < 40 ? 'Noch müde…' : 'Guten Morgen!', 2);
}

const QUIPS = ['git push!', 'Kompiliert!', 'Kein Bug :)', 'npm i …', 'Ship it!', 'Mehr Tokens?', 'Hallo!', 'Tests grün!'];
function quip() {
  if (S.hunger < 30) return say('Hunger…');
  if (S.energy < 25) return say('So müde…');
  if (S.fun < 30) return say('Spiel mit mir!');
  if (S.clean < 40) return say('Bugs überall!');
  say(QUIPS[Math.floor(Math.random() * QUIPS.length)]);
}

// ---------- images: the plugin's scenery and Clawd, loaded per scene / style ----------
let wantBg = '', wantSheet = '';
function loadImg(src, done) {
  const im = new Image();
  im.onload = () => done(im);
  im.src = src;
}
function loadWorld() {
  const bk = S.look + '-' + S.scene, sk = S.look;
  wantBg = bk; wantSheet = sk;
  if (bk !== R.bgKey) loadImg('assets/bg-' + bk + '.webp', im => { if (wantBg === bk) { R.bg = im; R.bgKey = bk; } });
  if (sk !== R.sheetKey) loadImg('assets/sheet-' + sk + '.webp', im => { if (wantSheet === sk) { R.sheet = im; R.sheetKey = sk; } });
  R.bugs = R.bugs.map(b => ({ ...b, y: clamp(b.y, feetY() - 4, MENU_Y - 12) }));
  makeAmbient();
}

// ---------- ambient life per scene (cheap canvas particles) ----------
const AMB = {
  forest:  { n: 14, col: '255,226,160', vx: [-4, 4], vy: [-6, -1], s: 2, a: .8 },
  space:   { n: 22, col: '255,255,255', vx: [0, 0], vy: [0, 0], s: 2, a: 1, twinkle: true, top: true },
  city:    { n: 30, col: '190,215,255', vx: [-10, -6], vy: [150, 190], s: 1, len: 7, a: .5 },
  desert:  { n: 14, col: '255,225,170', vx: [10, 24], vy: [-2, 2], s: 2, a: .6 },
  volcano: { n: 16, col: '255,150,60', vx: [-6, 6], vy: [-30, -12], s: 2, a: .9 },
  lab:     { n: 12, col: '255,240,200', vx: [-3, 3], vy: [-3, 3], s: 2, a: .5 },
  night:   { n: 12, col: '210,255,120', vx: [-5, 5], vy: [-5, 5], s: 2, a: 1, twinkle: true },
};
function makeAmbient() {
  const d = AMB[S.scene]; R.ambScene = S.scene; R.amb = [];
  for (let i = 0; i < d.n; i++)
    R.amb.push({ x: rnd(0, BGW), y: d.top ? rnd(TOP, TOP + 90) : rnd(TOP + 20, MENU_Y - 6), vx: rnd(d.vx[0], d.vx[1]), vy: rnd(d.vy[0], d.vy[1]), ph: rnd(0, 6) });
}
function updateAmbient(dt) {
  const d = AMB[R.ambScene]; if (!d) return;
  for (const a of R.amb) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.ph += dt * 2;
    if (a.x < 0) a.x += BGW; if (a.x > BGW) a.x -= BGW;
    if (a.y < TOP) a.y = MENU_Y - 8; if (a.y > MENU_Y - 4) a.y = d.top ? TOP + 4 : TOP + 10;
  }
}
function drawAmbient(cam) {
  const d = AMB[R.ambScene]; if (!d) return;
  for (const a of R.amb) {
    ctx.globalAlpha = d.a * (d.twinkle ? 0.35 + 0.65 * Math.abs(Math.sin(a.ph)) : 1);
    rect(a.x - cam, a.y, d.s, d.len || d.s, 'rgb(' + d.col + ')');
  }
  ctx.globalAlpha = 1;
}

// ---------- actions ----------
function act(i) {
  if (!ready) return;
  if (R.panel) return;
  if (R.sleeping) return wake(false);
  if (busyNow()) return;
  if (i === 0) {
    if (S.hunger >= 92) { setMode('refuse'); say('Satt!', 1.2); }
    else setMode('eat', { bites: 0 });
  } else if (i === 1) {
    if (S.energy < 15) { setMode('refuse'); say('Zu müde…', 1.2); }
    else setMode('play', { bounces: 0, cx: clamp(R.x, 100, BGW - 100) });
  } else if (i === 2) {
    R.sleeping = true; setMode('sleep'); say('Gute Nacht…');
  } else if (i === 3) {
    setMode('clean', { sweep: -10 });
    if (S.clean >= 95) say('Schon sauber!', 1.3);
  } else {
    R.panel = true; R.prow = 0;
  }
  saveSoon();
}
function changeWorld(dir) {
  if (R.prow === 0) S.scene = SCENES[(SCENES.indexOf(S.scene) + dir + SCENES.length) % SCENES.length];
  else { const i = LOOKS.findIndex(l => l.name === S.look); S.look = LOOKS[(i + dir + LOOKS.length) % LOOKS.length].name; }
  loadWorld(); saveSoon();
}
function closePanel() { R.panel = false; saveSoon(); }

// ---------- update ----------
function decay(dt) {
  const z = R.sleeping;
  S.hunger -= (z ? 0.008 : 0.016) * dt;
  S.fun -= (z ? 0.004 : 0.014) * dt;
  S.clean -= (z ? 0.004 : 0.011) * dt;
  S.energy += (z ? 0.6 : -0.010) * dt;
  for (const k of ['hunger', 'fun', 'energy', 'clean']) S[k] = clamp(S[k], 0, 100);
  R.careT += dt;
  if (R.careT >= 60) { R.careT = 0; if (Math.min(S.hunger, S.fun, S.energy, S.clean) >= 40) gainXp(1); }
}
function bugTarget() { return S.clean < 75 ? Math.min(5, Math.ceil((75 - S.clean) / 16)) : 0; }
function syncBugs() {
  const n = bugTarget();
  while (R.bugs.length < n)
    R.bugs.push({ x: rnd(30, BGW - 30), y: rnd(feetY() - 4, MENU_Y - 14), dir: Math.random() < .5 ? -1 : 1, v: rnd(5, 12), ph: 0 });
  while (R.bugs.length > n) puff(R.bugs.shift());
}
function puff(b) {
  for (let i = 0; i < 6; i++)
    R.P.push({ kind: 'rect', x: b.x + 6, y: b.y + 4, vx: rnd(-40, 40), vy: rnd(-50, -5), g: 120, life: .5, s: 2, col: '#7fe07f' });
}

function update(dt) {
  R.time += dt; R.t += dt; R.ox = 0; R.hop = 0;
  R.dim += ((R.sleeping ? 0.5 : 0) - R.dim) * Math.min(1, dt * 3);
  if (R.say) { R.say.t += dt; if (R.say.t > R.say.dur) R.say = null; }
  if (R.happy > 0) R.happy -= dt;
  if (R.greet > 0) R.greet -= dt;
  R.shakeCool -= dt; R.jerk *= 0.9;
  updateAmbient(dt);

  R.P = R.P.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; return (p.life -= dt) > 0; });
  for (const b of R.bugs) {
    b.ph += dt * 6; b.x += b.dir * b.v * dt;
    if (b.x < 10 || b.x > BGW - 20) b.dir = -b.dir;
    if (Math.random() < dt * .3) b.dir = -b.dir;
  }
  if (!ready) return;
  decay(dt);
  if (Math.floor(R.time) !== Math.floor(R.time - dt)) syncBugs();
  if (R.panel) return;

  const m = R.mode, sc = sz(), fy = feetY(), headY = fy - 60 * sc;
  if (m === 'idle' || m === 'walk') {
    if (R.evolved) { R.evolved = false; return cheer(); }
    if (S.energy <= 2) { R.sleeping = true; setMode('sleep'); say('zZz…'); return; }
    if (petting()) {
      if (m === 'walk') idle(1);
      S.fun = Math.min(100, S.fun + 4 * dt);
      R.petHeart -= dt; R.petXp += dt;
      if (R.petHeart <= 0) {
        R.petHeart = .4;
        R.P.push({ kind: 'heart', x: R.x + rnd(-14, 14), y: headY, vx: rnd(-8, 8), vy: -28, life: 1.2 });
      }
      if (R.petXp >= 4) { R.petXp = 0; gainXp(1); }
      return;
    }
  }
  if (m === 'idle') {
    R.wait -= dt;
    if (R.wait <= 0) {
      if (Math.random() < .4) quip();
      R.target = rnd(40, BGW - 40);
      if (Math.abs(R.target - R.x) < 30) R.target = clamp(R.x + (Math.random() < .5 ? -80 : 80), 40, BGW - 40);
      setMode('walk');
    }
  } else if (m === 'walk') {
    const d = R.target - R.x, sp = mood() === 'sad' ? 16 : 28;
    R.look = Math.sign(d) || R.look;
    R.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt);
    if (Math.abs(d) < 1.5) idle();
  } else if (m === 'eat') {
    const t = R.t, b = t < .7 ? 0 : Math.floor((t - .7) / .4) + 1;
    if (b > R.bites && b <= 4) {
      R.bites = b; S.hunger = Math.min(100, S.hunger + 8);
      for (let i = 0; i < 4; i++)
        R.P.push({ kind: 'rect', x: R.x, y: fy - 30 * sc, vx: rnd(-35, 35), vy: rnd(-40, -5), g: 160, life: .5, s: 2, col: '#E8B64C' });
    }
    if (t > 2.5) { gainXp(4); say('Lecker!'); endAction(1.5); }
  } else if (m === 'play') {
    const T = .7, n = Math.floor(R.t / T);
    if (n > R.bounces) { R.bounces = n; S.fun = Math.min(100, S.fun + 7); gainXp(1); }
    const nx = clamp(R.cx + Math.sin(R.t * 1.5) * 50, 40, BGW - 40);
    R.look = Math.sign(nx - R.x) || R.look; R.x = nx;
    if (R.t >= 4.2) {
      S.energy = Math.max(0, S.energy - 8); S.hunger = Math.max(0, S.hunger - 4);
      gainXp(4); say('Das war toll!'); endAction(1.5);
    }
  } else if (m === 'clean') {
    R.sweep = -10 + R.t / 1.6 * (BGW + 20);
    for (let i = R.bugs.length - 1; i >= 0; i--)
      if (R.bugs[i].x < R.sweep) { puff(R.bugs[i]); R.bugs.splice(i, 1); }
    for (let i = 0; i < 2; i++)
      R.P.push({ kind: 'rect', x: R.sweep, y: rnd(floorY() + 6, MENU_Y - 4), vx: -20, vy: rnd(-20, 0), life: .5, s: 2, col: Math.random() < .5 ? '#fff' : '#9fe3ff' });
    // Clawd follows the sweep
    R.x += (clamp(R.sweep - 30, 40, BGW - 40) - R.x) * Math.min(1, dt * 4);
    if (R.t > 1.8) { S.clean = Math.min(100, S.clean + 55); gainXp(5); say('Sauber!'); syncBugs(); endAction(1.5); }
  } else if (m === 'sleep') {
    if (Math.floor(R.t) !== Math.floor(R.t - dt))
      R.P.push({ kind: 'text', text: 'Z', s: 10 + Math.floor(Math.random() * 5), x: R.x + 12 * sc, y: headY, vx: 8, vy: -14, life: 2 });
    if (S.energy >= 100) { gainXp(3); wake(false); }
  } else if (m === 'dizzy') {
    R.ox = Math.sin(R.t * 12) * 2;
    if (R.t > 1.8) { say('Uff… schwindlig'); idle(1.5); }
  } else if (m === 'refuse') {
    if (R.t > 1.8) idle(1);
  } else if (m === 'cheer') {
    if (R.t > 2.2) idle(1);
  }
}

// ---------- drawing ----------
function lum(hex) { const n = parseInt(hex.slice(1), 16); return (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255; }
function ui() {
  const L = lookInfo();
  const dark = lum(L.ink) < lum(L.card) ? L.ink : L.card;
  const light = dark === L.ink ? L.card : L.ink;
  return { card: L.card, ink: L.ink, bg: dark, fg: light, acc: lum(L.accent) > 0.3 && L.accent !== dark ? L.accent : '#D97757' };
}

function animFor() {
  const m = R.mode;
  if (R.sleeping || m === 'sleep') return 'sleep';
  if (m === 'dizzy') return 'dizzy';
  if (m === 'refuse') return 'shrug';
  if (m === 'eat') return R.t > .7 ? 'eat' : 'idle';
  if (m === 'play') return 'dance';
  if (m === 'clean') return 'spin';
  if (m === 'cheer') return 'celebrate';
  if (petting()) return 'pet';
  if (m === 'walk') return 'walk';
  if (R.happy > 0) return 'happy';
  if (R.greet > 0) return 'wave';
  return mood() === 'sad' ? 'sad' : 'idle';
}

function drawClawd(cam) {
  if (!R.sheet) return;
  const name = animFor(), mo = MANI.motions[name], sc = sz();
  if (name !== R.anim) { R.anim = name; R.animT0 = R.time; }
  const frame = Math.floor((((R.time - R.animT0) / mo.dur) % 1) * mo.frames);
  const dw = CELLW * K * sc, dh = CELLH * K * sc;
  const sx = R.x + R.ox - cam, fy = feetY() - R.hop;
  const baseY = fy - (MANI.ch - 6) * SC * sc;
  ctx.imageSmoothingEnabled = S.look !== 'pixel';
  ctx.save();
  ctx.translate(Math.round(sx), 0);
  if (R.look < 0) ctx.scale(-1, 1);
  ctx.drawImage(R.sheet, frame * CELLW, mo.row * CELLH, CELLW, CELLH, Math.round(-dw / 2), Math.round(baseY), Math.round(dw), Math.round(dh));
  ctx.restore();
  return { top: fy - 56 * sc - (name === 'celebrate' ? 14 : 0), sx };
}

function drawBug(b, cam) {
  const x = b.x - cam, y = b.y, g = '#5fbf5f', gd = '#2f7f3f', f = b.dir > 0;
  const px_ = (o, w) => f ? x + o : x + 12 - o - w;
  rect(px_(1, 10), y + 2, 10, 5, g);
  rect(px_(9, 3), y + 3, 3, 3, gd);
  rect(px_(11, 1), y + 1, 1, 2, gd);
  const up = Math.floor(b.ph) % 2;
  for (let i = 0; i < 3; i++) rect(px_(2 + i * 3, 1), y + 7, 1, 2 + (i % 2 === up ? 1 : 0), gd);
}

function drawParticles(cam) {
  for (const p of R.P) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    if (p.kind === 'heart') spr('heart', p.x - cam - 5, p.y - 5, 2);
    else if (p.kind === 'text') {
      ctx.font = 'bold ' + p.s + 'px ' + FONT; ctx.textBaseline = 'middle';
      ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1a2e'; ctx.strokeText(p.text, p.x - cam, p.y);
      ctx.fillStyle = '#f6f1e2'; ctx.fillText(p.text, p.x - cam, p.y);
    } else rect(p.x - cam, p.y, p.s, p.s, p.col);
  }
  ctx.globalAlpha = 1;
}

function drawBubble(c, cam) {
  if (!R.say || !c) return;
  const u = ui();
  ctx.font = 'bold 9px ' + FONT; ctx.textBaseline = 'middle';
  const w = Math.ceil(ctx.measureText(R.say.text).width) + 12, h = 17;
  const bx = clamp(c.sx - w / 2, 3, W - w - 3), by = Math.max(TOP + 2, c.top - h - 8);
  ctx.globalAlpha = .22; rect(bx + 1, by + 2, w, h, '#000'); ctx.globalAlpha = 1;
  rect(bx - 2, by, w + 4, h, u.ink); rect(bx, by - 2, w, h + 4, u.ink);      // outline
  rect(bx, by, w, h, u.card); rect(bx - 1, by + 1, w + 2, h - 2, u.card);
  const tx = clamp(c.sx, bx + 6, bx + w - 6);
  rect(tx - 4, by + h, 8, 2, u.ink); rect(tx - 2, by + h + 2, 4, 3, u.ink);
  rect(tx - 3, by + h, 6, 2, u.card); rect(tx - 1, by + h + 2, 2, 2, u.card);
  ctx.fillStyle = u.ink; ctx.fillText(R.say.text, bx + 6, by + h / 2 + 1);
}

const barCol = v => v > 50 ? '#4cd964' : v > 25 ? '#ffcc00' : '#ff453a';
function drawHUD() {
  const u = ui();
  ctx.globalAlpha = .62; rect(0, TOP, W, 34, u.bg); ctx.globalAlpha = 1;
  [['hunger', 'feed'], ['fun', 'play'], ['energy', 'sleep'], ['clean', 'clean']].forEach(([k, ic], i) => {
    const x = 4 + i * 58;
    spr(ic, x, TOP + 3, 1);
    rect(x + 11, TOP + 5, 40, 5, 'rgba(0,0,0,.45)');
    rect(x + 11, TOP + 5, 40 * S[k] / 100, 5, barCol(S[k]));
  });
  const st = stage(), days = Math.floor((Date.now() - S.born) / 864e5) + 1;
  ctx.font = 'bold 8px ' + FONT; ctx.textBaseline = 'top'; ctx.fillStyle = u.fg;
  ctx.fillText(STAGES[st] + ' · Tag ' + days, 4, TOP + 17);
  ctx.globalAlpha = .6; ctx.textAlign = 'right';
  ctx.fillText('v' + APP_VERSION + ' ' + R.storageTag, W - 4, TOP + 17); ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  const lo = XP_AT[st], hi = XP_AT[st + 1];
  rect(4, TOP + 29, W - 8, 2, 'rgba(0,0,0,.45)');
  rect(4, TOP + 29, (W - 8) * (hi ? clamp((S.xp - lo) / (hi - lo), 0, 1) : 1), 2, u.acc);
}

function drawMenu() {
  const u = ui();
  rect(0, MENU_Y, W, H - MENU_Y, u.bg); rect(0, MENU_Y, W, 1, u.acc);
  const busy = !R.sleeping && busyNow();
  const labels = ['Essen', 'Spiel', R.sleeping ? 'Wecken' : 'Schlaf', 'Putzen', 'Welt'];
  const icons = ['feed', 'play', R.sleeping ? 'wake' : 'sleep', 'clean', 'world'];
  for (let i = 0; i < 5; i++) {
    const x = i * 48 + 2, y = MENU_Y + 3;
    if (i === R.sel) {
      rect(x, y, 44, 46, 'rgba(255,255,255,.1)');
      rect(x, y, 44, 2, u.acc); rect(x, y + 44, 44, 2, u.acc); rect(x, y, 2, 46, u.acc); rect(x + 42, y, 2, 46, u.acc);
    }
    ctx.globalAlpha = busy ? .4 : 1;
    spr(icons[i], x + 10, y + 5, 3);
    ctx.font = 'bold 8px ' + FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillStyle = i === R.sel ? u.fg : u.fg;
    ctx.globalAlpha *= i === R.sel ? 1 : .7;
    ctx.fillText(labels[i], x + 22, y + 36);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

const PANEL = { x: 10, y: 84, w: 220, h: 108 };
function drawPanel() {
  const u = ui(), p = PANEL;
  ctx.globalAlpha = .55; rect(0, TOP, W, MENU_Y - TOP, '#000'); ctx.globalAlpha = 1;
  rect(p.x - 2, p.y, p.w + 4, p.h, u.ink); rect(p.x, p.y - 2, p.w, p.h + 4, u.ink);
  rect(p.x, p.y, p.w, p.h, u.card);
  ctx.font = 'bold 10px ' + FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillStyle = u.ink; ctx.fillText('Welt', p.x + p.w / 2, p.y + 12);
  const rows = [['Ort', SCENE_DE[S.scene]], ['Stil', LOOK_DE[S.look] || S.look]];
  rows.forEach(([k, v], i) => {
    const y = p.y + 26 + i * 30;
    if (i === R.prow) { rect(p.x + 6, y, p.w - 12, 26, u.acc); ctx.globalAlpha = .25; rect(p.x + 6, y, p.w - 12, 26, '#fff'); ctx.globalAlpha = 1; }
    ctx.textAlign = 'left'; ctx.font = 'bold 8px ' + FONT;
    ctx.fillStyle = i === R.prow && lum(u.acc) > .55 ? '#1b1b1b' : u.ink;
    ctx.fillText(k, p.x + 12, y + 7);
    ctx.font = 'bold 10px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('‹  ' + v + '  ›', p.x + p.w / 2, y + 17);
  });
  ctx.textAlign = 'center'; ctx.font = 'bold 7px ' + FONT; ctx.fillStyle = u.ink; ctx.globalAlpha = .65;
  ctx.fillText('Rad: ändern · Taste: weiter/OK', p.x + p.w / 2, p.y + p.h - 8);
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

function draw() {
  const cam = camX(), u = ui();
  // scenery: the image fills the stage area; its top row is stretched up behind the OS bar
  if (R.bg) {
    ctx.imageSmoothingEnabled = S.look !== 'pixel';
    const iw = R.bg.naturalWidth, ih = R.bg.naturalHeight, k = iw / BGW;
    ctx.drawImage(R.bg, cam * k, 0, W * k, 1, 0, 0, W, TOP + 1);
    ctx.drawImage(R.bg, cam * k, 0, W * k, ih, 0, TOP, W, BGH);
  } else rect(0, 0, W, MENU_Y, '#101018');

  const fy = feetY();
  for (const b of R.bugs) if (b.y < fy) drawBug(b, cam);
  const c = drawClawd(cam);
  for (const b of R.bugs) if (b.y >= fy) drawBug(b, cam);

  const sc = sz();
  if (R.mode === 'eat') {
    const t = R.t, b = t < .7 ? 0 : Math.floor((t - .7) / .4) + 1;
    if (b < 5) {
      const s = [3, 3, 2, 2, 1][b], size = 8 * s, my = fy - 34 * sc - size / 2;
      spr('feed', R.x - cam - size / 2, t < .7 ? 80 + (my - 80) * (t / .7) : my, s);
    }
  } else if (R.mode === 'play') {
    const T = .7, uu = (R.t % T) / T;
    spr('play', R.x - cam - 8, fy - 62 * sc - 16 - Math.sin(Math.PI * uu) * 58, 2);
  } else if (R.mode === 'clean') {
    rect(R.sweep - cam, floorY(), 3, MENU_Y - floorY(), 'rgba(255,255,255,.7)');
  }
  drawParticles(cam);
  drawAmbient(cam);
  drawBubble(c, cam);

  if (R.dim > .01) { ctx.globalAlpha = R.dim; rect(0, TOP, W, MENU_Y - TOP, '#05060f'); ctx.globalAlpha = 1; }
  drawHUD();
  drawMenu();
  if (R.panel) drawPanel();
  if (!R.bg || !R.sheet || !ready) {
    rect(0, 130, W, 24, '#000'); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px ' + FONT;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText('Lade…', W / 2, 142); ctx.textAlign = 'left';
  }
}

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (ts - lastTs < 33) return;        // ~30 fps is plenty
  const dt = Math.min(.1, (ts - lastTs) / 1000); lastTs = ts;
  update(dt); draw();
}

// ---------- storage (Base64, UTF-8 safe, creationStorage first, localStorage mirror) ----------
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(get, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { const v = get(); if (v) return v; await sleepMs(100); }
  return get() || null;
}
let CS = null;
async function loadState() {
  // SDK objects arrive late on the device: poll up to 3 s there, hardly wait on desktop
  CS = await waitFor(() => window.creationStorage && window.creationStorage.plain, /Android/i.test(navigator.userAgent) ? 3000 : 250);
  R.storageTag = CS ? 'cs' : 'ls';
  let raw = null;
  try { if (CS) raw = await CS.getItem(KEY); } catch (e) {}
  if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
  if (raw) { try { return dec(raw); } catch (e) {} }
  return null;
}
let saveTimer = 0;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow() {
  if (!ready) return;
  S.last = Date.now();
  const s = enc(S);
  try { localStorage.setItem(KEY, s); } catch (e) {}
  try { if (CS) Promise.resolve(CS.setItem(KEY, s)).catch(() => {}); } catch (e) {}
}
setInterval(saveNow, 5000);
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

async function boot() {
  requestAnimationFrame(frame);
  loadWorld();                          // start fetching the default scenery right away
  try { document.fonts.load('bold 9px Monocraft'); } catch (e) {}
  const s = await loadState();
  if (s) {
    const num = (v, d) => (Number.isFinite(v) ? v : d);
    const el = clamp((Date.now() - num(s.last, Date.now())) / 1000, 0, 6 * 3600);
    // time away: slower decay, never below 15 so Clawd is only sad, never lost
    const off = (v, r) => Math.max(Math.min(v, 15), v - r * el * 0.6);
    S.hunger = off(clamp(num(s.hunger, 70), 0, 100), 0.016);
    S.fun = off(clamp(num(s.fun, 70), 0, 100), 0.014);
    S.clean = off(clamp(num(s.clean, 80), 0, 100), 0.011);
    S.energy = clamp(num(s.energy, 80), 0, 100);
    S.xp = Math.max(0, num(s.xp, 0));
    S.born = num(s.born, Date.now());
    if (SCENES.includes(s.scene)) S.scene = s.scene;
    if (LOOKS.some(l => l.name === s.look)) S.look = s.look;
    loadWorld();
    say(el > 1800 ? 'Du warst lange weg!' : 'Hallo wieder!', 2.5);
  } else {
    say('Hallo, ich bin Clawd!', 3);
  }
  ready = true; syncBugs(); saveNow();
}

// ---------- input ----------
const stepSel = d => { R.sel = (R.sel + d + 5) % 5; };
window.addEventListener('scrollUp', () => { if (R.panel) changeWorld(-1); else stepSel(-1); });
window.addEventListener('scrollDown', () => { if (R.panel) changeWorld(1); else stepSel(1); });
window.addEventListener('sideClick', () => {
  const n = performance.now();
  if (n - R.lastClick < 250) return;   // a double click arrives as two events ~50 ms apart
  R.lastClick = n;
  if (R.panel) { if (R.prow === 0) R.prow = 1; else closePanel(); return; }
  act(R.sel);
});
window.addEventListener('longPressStart', () => { if (R.panel) closePanel(); else R.hold = true; });
window.addEventListener('longPressEnd', () => { R.hold = false; });

function pos(e) {
  const t = (e.touches && e.touches[0]) || e, r = cv.getBoundingClientRect();
  return [(t.clientX - r.left) * W / r.width, (t.clientY - r.top) * H / r.height];
}
function down(e) {
  e.preventDefault();
  const [x, y] = pos(e);
  if (R.panel) {
    const p = PANEL;
    if (x < p.x || x > p.x + p.w || y < p.y || y > p.y + p.h) return closePanel();
    const row = Math.floor((y - p.y - 26) / 30);
    if (row === 0 || row === 1) { R.prow = row; changeWorld(x < W / 2 ? -1 : 1); }
    return;
  }
  if (y >= MENU_Y) { R.sel = clamp(Math.floor(x / 48), 0, 4); act(R.sel); return; }
  const sc = sz(), sx = R.x - camX();
  if (Math.abs(x - sx) < 34 * sc && y > feetY() - 66 * sc && y < feetY() + 6) {
    if (R.sleeping) wake(true); else R.touchPet = true;
  }
}
function up(e) { e.preventDefault(); R.touchPet = false; }
document.body.addEventListener('touchstart', down, { passive: false });
document.body.addEventListener('touchend', up, { passive: false });
document.body.addEventListener('touchcancel', up, { passive: false });
document.body.addEventListener('mousedown', down);
document.body.addEventListener('mouseup', up);

// shake -> dizzy (wakes a sleeping Clawd, grumpily)
function onAccel(d) {
  const x = d.tiltX ?? d.x ?? 0, y = d.tiltY ?? d.y ?? 0, z = d.tiltZ ?? d.z ?? 0;
  if (R.prev) R.jerk += Math.abs(x - R.prev[0]) + Math.abs(y - R.prev[1]) + Math.abs(z - R.prev[2]);
  R.prev = [x, y, z];
  if (R.jerk > 2.5 && R.shakeCool <= 0 && ready && !R.panel) {
    R.shakeCool = 4; R.jerk = 0;
    if (R.sleeping) wake(true);
    else if (R.mode === 'idle' || R.mode === 'walk') { S.fun = Math.min(100, S.fun + 5); setMode('dizzy'); }
  }
}
(async function initSensors() {
  try {
    const acc = await waitFor(() => window.creationSensors && window.creationSensors.accelerometer, 3000);
    if (acc && await acc.isAvailable()) acc.start(onAccel, { frequency: 30 });
  } catch (e) {}
})();

// desktop preview shim: arrows = wheel, Enter/Space = side click, H = hold (pet)
if (typeof window.PluginMessageHandler === 'undefined') {
  const map = { ArrowUp: 'scrollUp', ArrowLeft: 'scrollUp', ArrowDown: 'scrollDown', ArrowRight: 'scrollDown', Enter: 'sideClick', ' ': 'sideClick' };
  window.addEventListener('keydown', e => {
    if (map[e.key]) { e.preventDefault(); window.dispatchEvent(new Event(map[e.key])); }
    else if ((e.key === 'h' || e.key === 'H') && !e.repeat) window.dispatchEvent(new Event('longPressStart'));
  });
  window.addEventListener('keyup', e => { if (e.key === 'h' || e.key === 'H') window.dispatchEvent(new Event('longPressEnd')); });
}

boot();
</script>
