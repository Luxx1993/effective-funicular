<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Clawd</title>
<style>
  /*@FONT@*/
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 240px; height: 282px; display: block; touch-action: none;
           -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c" width="240" height="282"></canvas>
<script>
'use strict';
// Clawd, a tamagotchi diorama. Scenery, styles and Clawd's animations come from the
// Claude Fables plugin (baked to images by src/r1assets.ts).
const APP_VERSION = '0.3.0';
const KEY = 'clawd:state';          // namespaced: all creations share one origin
const MANI = /*@MANI@*/null;
const LOOKS = /*@LOOKS@*/null;
const W = 240, H = 282;
const TOP = 40;                     // the OS bar covers the top 40 px: HUD starts below
const MENU_Y = 246;                 // the menu strip over the bottom of the scenery
const BGS = MANI.bgscale;           // scenery image px per stage unit, shown 1:1
const BGW = MANI.sw * BGS, BGH = MANI.h * BGS;   // 800 x 320
const BG_YOFF = 55;                 // crop the sky so the floor line sits near y 205
const K = 0.95;                     // Clawd sheet px -> logical px
const CELLW = MANI.cw * MANI.scale, CELLH = MANI.ch * MANI.scale;
const SCENES = ['forest', 'space', 'city', 'desert', 'volcano', 'lab', 'night'];
const SCENE_DE = { forest: 'Wald', space: 'Weltraum', city: 'Stadt', desert: 'Wüste', volcano: 'Vulkan', lab: 'Labor', night: 'Dorf' };
const LOOK_DE = { pixel: 'Pixel Art', original: 'Original', cave: 'Höhle', blueprint: 'Blaupause', mosaic: 'Mosaik', aero: 'Frutiger Aero', engraving: 'Kupferstich', tapestry: 'Wandteppich', golden: 'Golden Age', ukiyoe: 'Ukiyo-e', kamon: 'Kamon' };

const cv = document.getElementById('c');
const DPR = Math.min(2, Math.max(1, Math.round(window.devicePixelRatio || 1)));
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext('2d');
ctx.scale(DPR, DPR);

const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- state ----------
const S = { hunger: 70, fun: 70, energy: 80, clean: 80, xp: 0, born: Date.now(), last: Date.now(), scene: 'forest', look: 'original' };
let ready = false;
const R = {
  x: 240, ox: 0, look: 1, mode: 'idle', t: 0, wait: 2, target: 240, hop: 0, time: 0, happy: 0, greet: 3,
  hold: false, touchPet: false, sleeping: false, sel: 0, lastClick: 0,
  bugs: [], P: [], say: null, dim: 0, evolved: false, petHeart: 0, petXp: 0,
  careT: 0, jerk: 0, prev: null, shakeCool: 0, storageTag: '?',
  bg: null, sheet: null, bgKey: '', sheetKey: '', anim: '', animT0: 0,
  panel: false, prow: 0, amb: [], ambScene: '',
};
const STAGES = ['Baby-Clawd', 'Clawd', 'Mega-Clawd'];
const XP_AT = [0, 150, 500];
const SIZE = [0.75, 1, 1.25];
const stage = () => (S.xp >= XP_AT[2] ? 2 : S.xp >= XP_AT[1] ? 1 : 0);
const sz = () => SIZE[stage()];
const floorY = () => MANI.floors[S.scene] * BGS - BG_YOFF;
const feetY = () => Math.min(floorY() + 14, MENU_Y - 10);
const camX = () => clamp(R.x - W / 2, 0, BGW - W);
const petting = () => (R.hold || R.touchPet) && !R.sleeping && (R.mode === 'idle' || R.mode === 'walk') && !R.panel;
const busyNow = () => !(R.mode === 'idle' || R.mode === 'walk');

function mood() {
  const m = Math.min(S.hunger, S.fun, S.energy, S.clean);
  const a = (S.hunger + S.fun + S.energy + S.clean) / 4;
  return m < 25 ? 'sad' : a > 70 ? 'happy' : 'ok';
}
function setMode(m, data) { R.mode = m; R.t = 0; Object.assign(R, data || {}); }
function idle(w) { setMode('idle', { wait: w == null ? rnd(1.5, 4) : w }); }
function say(text, dur) { R.say = { text, t: 0, dur: dur || 2 }; }
function gainXp(n) {
  const old = stage();
  S.xp += n;
  if (stage() > old) R.evolved = true;
}
function endAction(happyFor) {
  R.happy = happyFor || 0;
  if (R.evolved) { R.evolved = false; cheer(); } else idle(1.5);
}
function cheer() {
  setMode('cheer');
  say('Level up!', 2.2);
  const fy = feetY();
  for (let i = 0; i < 30; i++)
    R.P.push({ kind: 'rect', x: R.x, y: fy - 50, vx: rnd(-70, 70), vy: rnd(-150, -40), g: 220, life: rnd(1, 1.8),
               s: 3, col: ['#ffd24a', '#ff5c7a', '#33b5b0', '#fff', '#D97757'][i % 5] });
}
function wake(grumpy) {
  R.sleeping = false; R.happy = 0;
  idle(1.5);
  say(grumpy ? 'Hey! Ich schlief!' : S.energy < 40 ? 'Noch müde…' : 'Guten Morgen!', 2);
}

const QUIPS = ['git push!', 'Kompiliert!', 'Kein Bug :)', 'npm i …', 'Ship it!', 'Mehr Tokens?', 'Hallo!', 'Tests grün!'];
function quip() {
  if (S.hunger < 30) return say('Hunger…');
  if (S.energy < 25) return say('So müde…');
  if (S.fun < 30) return say('Spiel mit mir!');
  if (S.clean < 40) return say('Bugs überall!');
  say(QUIPS[Math.floor(Math.random() * QUIPS.length)]);
}

// ---------- the styles: icons, frames and type follow the scenery's art style ----------
const MONO = 'Monocraft, ui-monospace, monospace';
const SERIF = "Georgia, 'Times New Roman', serif";
const SANS = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
const COMIC = "'Comic Sans MS', 'Comic Neue', cursive, sans-serif";
const one = c => ({ feed: [c, c], play: [c, c, c], sleep: [c], clean: [c, c], heart: [c], bug: [c, c] });
const NAT = { feed: ['#E8B64C', '#8a5a1e'], play: ['#33b5b0', '#d9fffb', '#1b7471'], sleep: ['#cfd8ff'], clean: ['#a8743c', '#e8d27a'], heart: ['#ff5c7a'], bug: ['#5fbf5f', '#2f7f3f'] };
// font, size factor, outline (ink, width in 16-unit icon space), px = low-res grid the icons are drawn on (tile = as tesserae/weave),
// frame = how panels and bubbles are framed, tones = [main, detail, light] per icon
const STY = {
  original:  { font: MONO, fs: 1, ink: '#2b2420', lw: .9, frame: 'round', r: 4, bw: 2, tones: NAT },
  pixel:     { font: MONO, fs: 1, ink: '#3a1e14', lw: 0, px: 16, frame: 'pixel', tones: NAT },
  cave:      { font: COMIC, fs: 1.1, italic: true, ink: '#1b130f', lw: 1.3, frame: 'round', r: 7, bw: 2.5,
               tones: { feed: ['#cf8a2e', '#a4452a'], play: ['#a4452a', '#e6d6b2', '#1b130f'], sleep: ['#e6d6b2'], clean: ['#1b130f', '#cf8a2e'], heart: ['#a4452a'], bug: ['#1b130f', '#a4452a'] } },
  blueprint: { font: SANS, fs: 1.1, upper: true, ink: '#e8f0ff', lw: .8, line: true, frame: 'double', tones: one('#e8f0ff') },
  mosaic:    { font: SERIF, fs: 1.1, ink: '#2c2723', lw: 0, px: 12, tile: true, frame: 'tile', alt: '#c49a58',
               tones: { feed: ['#c49a58', '#2c2723'], play: ['#3b76a6', '#dbe7ea', '#2c2723'], sleep: ['#e8dec6'], clean: ['#2c2723', '#c49a58'], heart: ['#a5452f'], bug: ['#4b5560', '#a5452f'] } },
  aero:      { font: SANS, fs: 1.1, ink: '#ffffff', lw: 1.1, gloss: true, frame: 'gloss', r: 9, stroke: '#2a8ad8',
               tones: { feed: ['#ffa53c', '#b23a06'], play: ['#38c4e8', '#ffffff', '#0d78dc'], sleep: ['#dff3ff'], clean: ['#0d78dc', '#ffbd5c'], heart: ['#ff5c8a'], bug: ['#6fd13f', '#2a6a10'] } },
  engraving: { font: SERIF, fs: 1.1, ink: '#1c1611', lw: .9, hatch: true, frame: 'double',
               tones: { feed: ['#d9c9a4', '#1c1611'], play: ['#d9c9a4', '#f6f0e2', '#1c1611'], sleep: ['#e8dcc0'], clean: ['#1c1611', '#d9c9a4'], heart: ['#cdb98f'], bug: ['#1c1611', '#cdb98f'] } },
  tapestry:  { font: SERIF, fs: 1.1, ink: '#1a0b08', lw: 0, px: 10, tile: true, frame: 'weave', alts: ['#93321f', '#e2b437', '#2f4a6a'],
               tones: { feed: ['#e2b437', '#6a3f20'], play: ['#2f4a6a', '#efb39a', '#141e38'], sleep: ['#e8dab4'], clean: ['#6a3f20', '#e2b437'], heart: ['#b64a2d'], bug: ['#2f5236', '#93321f'] } },
  golden:    { font: COMIC, fs: 1.1, upper: true, ink: '#16120f', lw: 1.6, frame: 'shadow', r: 8, bw: 3,
               tones: { feed: ['#ffd23f', '#9f3c24'], play: ['#d63a2a', '#fffbe8', '#16120f'], sleep: ['#fffbe8'], clean: ['#16120f', '#ffd23f'], heart: ['#d63a2a'], bug: ['#2f6a24', '#16120f'] } },
  ukiyoe:    { font: SERIF, fs: 1.1, ink: '#1a2238', lw: .8, frame: 'seal',
               tones: { feed: ['#e2b437', '#93402a'], play: ['#3a62a0', '#f6f1e4', '#1d3866'], sleep: ['#f6f1e4'], clean: ['#1a2238', '#e2b437'], heart: ['#b8322a'], bug: ['#1d3866', '#b8322a'] } },
  kamon:     { font: SERIF, fs: 1.1, ink: '#1a1816', lw: 0, frame: 'thin',
               tones: { feed: ['#eee7d7', '#1a1816'], play: ['#eee7d7', '#1a1816', '#1a1816'], sleep: ['#eee7d7'], clean: ['#eee7d7', '#eee7d7'], heart: ['#eee7d7'], bug: ['#eee7d7', '#1a1816'] } },
};
const STYLE = () => STY[S.look] || STY.original;
const lookInfo = () => LOOKS.find(l => l.name === S.look) || LOOKS[1];
const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255; };
function ui() {
  const L = lookInfo();
  const dark = lum(L.ink) < lum(L.card) ? L.ink : L.card;
  const light = dark === L.ink ? L.card : L.ink;
  // card/ink: a panel and its text; bg/fg: translucent strips over the scenery
  return { card: L.card, ink: L.ink, bg: dark, fg: light, acc: lum(L.accent) > 0.3 && L.accent !== dark ? L.accent : '#D97757' };
}

// icons: shapes in a 16 x 16 box, [role] indexes the style's tones
const SHAPES = {
  feed:  [{ t: 'c', a: [8, 8, 7], r: 0 }, { t: 'c', a: [5, 5.5, 1.3], r: 1, n: 1 }, { t: 'c', a: [10.5, 6, 1.3], r: 1, n: 1 }, { t: 'c', a: [7, 10.5, 1.3], r: 1, n: 1 }, { t: 'c', a: [11.2, 11, 1.1], r: 1, n: 1 }, { t: 'c', a: [4.5, 9.8, 1], r: 1, n: 1 }],
  play:  [{ t: 'c', a: [8, 8, 7], r: 0 }, { t: 'p', d: 'M1.4 8.5 Q8 3 14.6 8.5', r: 1, s: 1.6 }, { t: 'c', a: [5.5, 5, 1.4], r: 1, n: 1 }],
  sleep: [{ t: 'p', d: 'M10 1 A7 7 0 1 0 15 11 A5.5 5.5 0 1 1 10 1Z', r: 0 }],
  clean: [{ t: 'l', a: [13, 2, 7, 9], r: 0, s: 2.2 }, { t: 'p', d: 'M3.5 9 L10 8 L13 14.5 L2 14.5Z', r: 1 }],
  heart: [{ t: 'p', d: 'M8 14.5 C-1 8 2 1.5 8 5 C14 1.5 17 8 8 14.5Z', r: 0 }],
  bug:   [{ t: 'e', a: [7.5, 9, 5.5, 3.8], r: 0 }, { t: 'c', a: [13.3, 9, 2.3], r: 1 }, { t: 'l', a: [4, 12, 3, 15], r: 1, s: 1.2 }, { t: 'l', a: [8, 12.5, 8, 15.5], r: 1, s: 1.2 }, { t: 'l', a: [11, 12, 12, 15], r: 1, s: 1.2 }, { t: 'l', a: [14, 7, 15.5, 4], r: 1, s: 1 }],
};
const ICACHE = {};
function iconCanvas(name, size) {
  const st = STYLE(), key = S.look + name + size;
  if (ICACHE[key]) return ICACHE[key];
  const out = Math.max(8, Math.round(size * DPR)), res = st.px || out;
  const c = document.createElement('canvas'); c.width = c.height = res;
  const g = c.getContext('2d'); g.scale(res / 16, res / 16); g.lineJoin = g.lineCap = 'round';
  const tn = st.tones[name];
  for (const sh of SHAPES[name]) {
    let p = new Path2D();
    if (sh.t === 'c') p.arc(sh.a[0], sh.a[1], sh.a[2], 0, 6.2832);
    else if (sh.t === 'e') p.ellipse(sh.a[0], sh.a[1], sh.a[2], sh.a[3], 0, 0, 6.2832);
    else if (sh.t === 'l') { p.moveTo(sh.a[0], sh.a[1]); p.lineTo(sh.a[2], sh.a[3]); }
    else p = new Path2D(sh.d);
    if (sh.t === 'l' || sh.s) { g.strokeStyle = st.line ? st.ink : tn[sh.r]; g.lineWidth = sh.s; g.stroke(p); continue; }
    g.fillStyle = st.line ? 'rgba(232,240,255,.16)' : tn[sh.r]; g.fill(p);
    if (st.lw && !sh.n) { g.strokeStyle = st.ink; g.lineWidth = st.lw; g.stroke(p); }
  }
  if (st.gloss || st.hatch) {
    g.globalCompositeOperation = 'source-atop';
    if (st.gloss) { const gr = g.createLinearGradient(0, 0, 0, 10); gr.addColorStop(0, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 16, 16); }
    else { g.strokeStyle = 'rgba(28,22,17,.45)'; g.lineWidth = .5; for (let i = -16; i < 32; i += 1.6) { g.beginPath(); g.moveTo(i, 16); g.lineTo(i + 16, 0); g.stroke(); } }
    g.globalCompositeOperation = 'source-over';
  }
  let result = c;
  if (st.px) {
    const o = document.createElement('canvas'); o.width = o.height = out;
    const og = o.getContext('2d'); og.imageSmoothingEnabled = false;
    if (st.tile) {
      const d = g.getImageData(0, 0, res, res).data, cell = out / res, gap = Math.max(.5, cell * .14);
      for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {
        const i = (y * res + x) * 4; if (d[i + 3] < 100) continue;
        og.fillStyle = 'rgb(' + d[i] + ',' + d[i + 1] + ',' + d[i + 2] + ')';
        og.fillRect(x * cell + gap, y * cell + gap, cell - gap * 2, cell - gap * 2);
      }
    } else og.drawImage(c, 0, 0, out, out);
    result = o;
  }
  return (ICACHE[key] = result);
}
function icon(name, x, y, size, flip) {
  const im = iconCanvas(name, size);
  if (flip) { ctx.save(); ctx.translate(Math.round(x + size), Math.round(y)); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, size, size); ctx.restore(); }
  else ctx.drawImage(im, Math.round(x), Math.round(y), size, size);
}

// frames and type
const fontStr = (px, bold = true) => { const st = STYLE(); return (st.italic ? 'italic ' : '') + (bold ? 'bold ' : '') + Math.round(px * st.fs) + 'px ' + st.font; };
function txt(s, x, y, o = {}) {
  const st = STYLE(), u = ui();
  if (st.upper) s = s.toUpperCase();
  let size = o.size || 9;
  ctx.font = fontStr(size);
  if (o.maxW) { const w = ctx.measureText(s).width; if (w > o.maxW) { size = size * o.maxW / w; ctx.font = fontStr(size); } }
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.halo) { ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = u.bg; ctx.globalAlpha *= .85; ctx.strokeText(s, x, y); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha; }
  ctx.fillStyle = o.fill || u.fg; ctx.fillText(s, x, y);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}
const textW = (s, size) => { const st = STYLE(); ctx.font = fontStr(size); return Math.ceil(ctx.measureText(st.upper ? s.toUpperCase() : s).width); };
function rpath(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// an opaque paper panel (bubble, dialog) in the style's frame
function box(x, y, w, h) {
  const st = STYLE(), u = ui(), f = st.frame;
  ctx.save();
  if (f === 'round' || f === 'gloss' || f === 'shadow') {
    if (f === 'shadow') { rpath(x + 3, y + 3, w, h, st.r); ctx.fillStyle = u.ink; ctx.fill(); }
    else { ctx.globalAlpha = .25; rpath(x + 1, y + 2, w, h, st.r); ctx.fillStyle = '#000'; ctx.fill(); ctx.globalAlpha = 1; }
    rpath(x, y, w, h, st.r); ctx.fillStyle = u.card; ctx.fill();
    ctx.lineWidth = st.bw; ctx.strokeStyle = st.stroke || u.ink; ctx.stroke();
    if (f === 'gloss') {
      rpath(x + 1.5, y + 1.5, w - 3, h - 3, st.r - 1); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1; ctx.stroke();
      const gr = ctx.createLinearGradient(0, y, 0, y + h / 2); gr.addColorStop(0, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,.05)');
      rpath(x + 2, y + 2, w - 4, h / 2 - 2, st.r - 2); ctx.fillStyle = gr; ctx.fill();
    }
  } else if (f === 'pixel') {
    ctx.globalAlpha = .25; ctx.fillStyle = '#000'; ctx.fillRect(x + 1, y + 3, w, h); ctx.globalAlpha = 1;
    rect(x - 2, y, w + 4, h, u.ink); rect(x, y - 2, w, h + 4, u.ink); rect(x, y, w, h, u.card); rect(x - 1, y + 1, w + 2, h - 2, u.card);
  } else if (f === 'double') {
    rect(x, y, w, h, u.card);
    ctx.strokeStyle = u.ink; ctx.lineWidth = 1.5; ctx.strokeRect(x + .75, y + .75, w - 1.5, h - 1.5);
    ctx.lineWidth = .8; ctx.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7);
  } else if (f === 'tile' || f === 'weave') {
    const cols = f === 'tile' ? [u.ink, st.alt] : st.alts, s = 4;
    rect(x, y, w, h, u.card);
    for (let i = 0, px_ = x; px_ < x + w; px_ += s, i++) { rect(px_, y, Math.min(s, x + w - px_), s, cols[i % cols.length]); rect(px_, y + h - s, Math.min(s, x + w - px_), s, cols[(i + 1) % cols.length]); }
    for (let i = 0, py = y + s; py < y + h - s; py += s, i++) { rect(x, py, s, Math.min(s, y + h - s - py), cols[(i + 1) % cols.length]); rect(x + w - s, py, s, Math.min(s, y + h - s - py), cols[i % cols.length]); }
  } else if (f === 'seal') {
    rect(x, y, w, h, u.card); ctx.strokeStyle = u.ink; ctx.lineWidth = 1.5; ctx.strokeRect(x + .75, y + .75, w - 1.5, h - 1.5);
    rect(x + w - 11, y - 4, 10, 10, '#b8322a'); rect(x + w - 9, y - 2, 6, 6, '#e9dcc0'); rect(x + w - 8, y - 1, 4, 4, '#b8322a');
  } else {  // thin: kamon, cream lines on silk
    rect(x, y, w, h, u.card); ctx.strokeStyle = u.ink; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); ctx.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7);
  }
  ctx.restore();
}
// a translucent strip over the scenery (HUD, menu): hairlines in the style's line
function strip(x, y, w, h, strong) {
  const st = STYLE(), u = ui();
  ctx.globalAlpha = strong ? .55 : .36; rect(x, y, w, h, u.bg); ctx.globalAlpha = 1;
  if (st.frame === 'gloss') { const gr = ctx.createLinearGradient(0, y, 0, y + h / 2); gr.addColorStop(0, 'rgba(255,255,255,.28)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gr; ctx.fillRect(x, y, w, h / 2); }
  const lw = st.frame === 'shadow' ? 2 : 1;
  ctx.globalAlpha = strong ? .95 : .6; rect(x, y, w, lw, strong ? u.acc : u.fg); rect(x, y + h - lw, w, lw, strong ? u.acc : u.fg); ctx.globalAlpha = 1;
}

// ---------- images: the plugin's scenery and Clawd, loaded per scene / style ----------
let wantBg = '', wantSheet = '';
function loadImg(src, done) {
  const im = new Image();
  im.onload = () => done(im);
  im.src = src;
}
function ICACHE_RESET() {}
function loadWorld() {
  const bk = S.look + '-' + S.scene, sk = S.look;
  wantBg = bk; wantSheet = sk;
  if (bk !== R.bgKey) loadImg('assets/bg-' + bk + '.webp', im => { if (wantBg === bk) { R.bg = im; R.bgKey = bk; } });
  if (sk !== R.sheetKey) loadImg('assets/sheet-' + sk + '.webp', im => { if (wantSheet === sk) { R.sheet = im; R.sheetKey = sk; } });
  R.bugs = R.bugs.map(b => ({ ...b, y: clamp(b.y, feetY() - 4, MENU_Y - 20) }));
  makeAmbient();
}

// ---------- ambient life per scene (cheap canvas particles) ----------
const AMB = {
  forest:  { n: 14, col: '255,226,160', vx: [-4, 4], vy: [-6, -1], s: 2, a: .8 },
  space:   { n: 22, col: '255,255,255', vx: [0, 0], vy: [0, 0], s: 2, a: 1, twinkle: true, top: true },
  city:    { n: 30, col: '190,215,255', vx: [-10, -6], vy: [150, 190], s: 1, len: 7, a: .5 },
  desert:  { n: 14, col: '255,225,170', vx: [10, 24], vy: [-2, 2], s: 2, a: .6 },
  volcano: { n: 16, col: '255,150,60', vx: [-6, 6], vy: [-30, -12], s: 2, a: .9 },
  lab:     { n: 12, col: '255,240,200', vx: [-3, 3], vy: [-3, 3], s: 2, a: .5 },
  night:   { n: 12, col: '210,255,120', vx: [-5, 5], vy: [-5, 5], s: 2, a: 1, twinkle: true },
};
function makeAmbient() {
  const d = AMB[S.scene]; R.ambScene = S.scene; R.amb = [];
  for (let i = 0; i < d.n; i++)
    R.amb.push({ x: rnd(0, BGW), y: d.top ? rnd(TOP, TOP + 90) : rnd(TOP + 20, MENU_Y - 6), vx: rnd(d.vx[0], d.vx[1]), vy: rnd(d.vy[0], d.vy[1]), ph: rnd(0, 6) });
}
function updateAmbient(dt) {
  const d = AMB[R.ambScene]; if (!d) return;
  for (const a of R.amb) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.ph += dt * 2;
    if (a.x < 0) a.x += BGW; if (a.x > BGW) a.x -= BGW;
    if (a.y < TOP) a.y = MENU_Y - 12; if (a.y > MENU_Y - 6) a.y = d.top ? TOP + 4 : TOP + 10;
  }
}
function drawAmbient(cam) {
  const d = AMB[R.ambScene]; if (!d) return;
  for (const a of R.amb) {
    ctx.globalAlpha = d.a * (d.twinkle ? 0.35 + 0.65 * Math.abs(Math.sin(a.ph)) : 1);
    rect(a.x - cam, a.y, d.s, d.len || d.s, 'rgb(' + d.col + ')');
  }
  ctx.globalAlpha = 1;
}

// ---------- actions ----------
function act(i) {
  if (!ready) return;
  if (R.panel) return;
  if (R.sleeping) return wake(false);
  if (busyNow()) return;
  if (i === 0) {
    if (S.hunger >= 92) { setMode('refuse'); say('Satt!', 1.2); }
    else setMode('eat', { bites: 0 });
  } else if (i === 1) {
    if (S.energy < 15) { setMode('refuse'); say('Zu müde…', 1.2); }
    else setMode('play', { bounces: 0, cx: clamp(R.x, 100, BGW - 100) });
  } else if (i === 2) {
    R.sleeping = true; setMode('sleep'); say('Gute Nacht…');
  } else if (i === 3) {
    setMode('clean', { sweep: -10 });
    if (S.clean >= 95) say('Schon sauber!', 1.3);
  } else {
    R.panel = true; R.prow = 0;
  }
  saveSoon();
}
function changeWorld(dir) {
  if (R.prow === 0) S.scene = SCENES[(SCENES.indexOf(S.scene) + dir + SCENES.length) % SCENES.length];
  else { const i = LOOKS.findIndex(l => l.name === S.look); S.look = LOOKS[(i + dir + LOOKS.length) % LOOKS.length].name; }
  loadWorld(); saveSoon();
}
function closePanel() { R.panel = false; saveSoon(); }

// ---------- update ----------
function decay(dt) {
  const z = R.sleeping;
  S.hunger -= (z ? 0.008 : 0.016) * dt;
  S.fun -= (z ? 0.004 : 0.014) * dt;
  S.clean -= (z ? 0.004 : 0.011) * dt;
  S.energy += (z ? 0.6 : -0.010) * dt;
  for (const k of ['hunger', 'fun', 'energy', 'clean']) S[k] = clamp(S[k], 0, 100);
  R.careT += dt;
  if (R.careT >= 60) { R.careT = 0; if (Math.min(S.hunger, S.fun, S.energy, S.clean) >= 40) gainXp(1); }
}
function bugTarget() { return S.clean < 75 ? Math.min(5, Math.ceil((75 - S.clean) / 16)) : 0; }
function syncBugs() {
  const n = bugTarget();
  while (R.bugs.length < n)
    R.bugs.push({ x: rnd(30, BGW - 30), y: rnd(feetY() - 4, MENU_Y - 20), dir: Math.random() < .5 ? -1 : 1, v: rnd(5, 12), ph: 0 });
  while (R.bugs.length > n) puff(R.bugs.shift());
}
function puff(b) {
  for (let i = 0; i < 6; i++)
    R.P.push({ kind: 'rect', x: b.x + 6, y: b.y + 4, vx: rnd(-40, 40), vy: rnd(-50, -5), g: 120, life: .5, s: 2, col: '#7fe07f' });
}

function update(dt) {
  R.time += dt; R.t += dt; R.ox = 0; R.hop = 0;
  R.dim += ((R.sleeping ? 0.5 : 0) - R.dim) * Math.min(1, dt * 3);
  if (R.say) { R.say.t += dt; if (R.say.t > R.say.dur) R.say = null; }
  if (R.happy > 0) R.happy -= dt;
  if (R.greet > 0) R.greet -= dt;
  R.shakeCool -= dt; R.jerk *= 0.9;
  updateAmbient(dt);

  R.P = R.P.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; return (p.life -= dt) > 0; });
  for (const b of R.bugs) {
    b.ph += dt * 6; b.x += b.dir * b.v * dt;
    if (b.x < 10 || b.x > BGW - 20) b.dir = -b.dir;
    if (Math.random() < dt * .3) b.dir = -b.dir;
  }
  if (!ready) return;
  decay(dt);
  if (Math.floor(R.time) !== Math.floor(R.time - dt)) syncBugs();
  if (R.panel) return;

  const m = R.mode, sc = sz(), fy = feetY(), headY = fy - 76 * sc;
  if (m === 'idle' || m === 'walk') {
    if (R.evolved) { R.evolved = false; return cheer(); }
    if (S.energy <= 2) { R.sleeping = true; setMode('sleep'); say('zZz…'); return; }
    if (petting()) {
      if (m === 'walk') idle(1);
      S.fun = Math.min(100, S.fun + 4 * dt);
      R.petHeart -= dt; R.petXp += dt;
      if (R.petHeart <= 0) {
        R.petHeart = .4;
        R.P.push({ kind: 'heart', x: R.x + rnd(-14, 14), y: headY, vx: rnd(-8, 8), vy: -28, life: 1.2 });
      }
      if (R.petXp >= 4) { R.petXp = 0; gainXp(1); }
      return;
    }
  }
  if (m === 'idle') {
    R.wait -= dt;
    if (R.wait <= 0) {
      if (Math.random() < .4) quip();
      R.target = rnd(40, BGW - 40);
      if (Math.abs(R.target - R.x) < 30) R.target = clamp(R.x + (Math.random() < .5 ? -80 : 80), 40, BGW - 40);
      setMode('walk');
    }
  } else if (m === 'walk') {
    const d = R.target - R.x, sp = mood() === 'sad' ? 16 : 28;
    R.look = Math.sign(d) || R.look;
    R.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt);
    if (Math.abs(d) < 1.5) idle();
  } else if (m === 'eat') {
    const t = R.t, b = t < .7 ? 0 : Math.floor((t - .7) / .4) + 1;
    if (b > R.bites && b <= 4) {
      R.bites = b; S.hunger = Math.min(100, S.hunger + 8);
      for (let i = 0; i < 4; i++)
        R.P.push({ kind: 'rect', x: R.x, y: fy - 38 * sc, vx: rnd(-35, 35), vy: rnd(-40, -5), g: 160, life: .5, s: 2, col: '#E8B64C' });
    }
    if (t > 2.5) { gainXp(4); say('Lecker!'); endAction(1.5); }
  } else if (m === 'play') {
    const T = .7, n = Math.floor(R.t / T);
    if (n > R.bounces) { R.bounces = n; S.fun = Math.min(100, S.fun + 7); gainXp(1); }
    const nx = clamp(R.cx + Math.sin(R.t * 1.5) * 50, 40, BGW - 40);
    R.look = Math.sign(nx - R.x) || R.look; R.x = nx;
    if (R.t >= 4.2) {
      S.energy = Math.max(0, S.energy - 8); S.hunger = Math.max(0, S.hunger - 4);
      gainXp(4); say('Das war toll!'); endAction(1.5);
    }
  } else if (m === 'clean') {
    R.sweep = -10 + R.t / 1.6 * (BGW + 20);
    for (let i = R.bugs.length - 1; i >= 0; i--)
      if (R.bugs[i].x < R.sweep) { puff(R.bugs[i]); R.bugs.splice(i, 1); }
    for (let i = 0; i < 2; i++)
      R.P.push({ kind: 'rect', x: R.sweep, y: rnd(floorY() + 6, MENU_Y - 6), vx: -20, vy: rnd(-20, 0), life: .5, s: 2, col: Math.random() < .5 ? '#fff' : '#9fe3ff' });
    // Clawd follows the sweep
    R.x += (clamp(R.sweep - 30, 40, BGW - 40) - R.x) * Math.min(1, dt * 4);
    if (R.t > 1.8) { S.clean = Math.min(100, S.clean + 55); gainXp(5); say('Sauber!'); syncBugs(); endAction(1.5); }
  } else if (m === 'sleep') {
    if (Math.floor(R.t) !== Math.floor(R.t - dt))
      R.P.push({ kind: 'text', text: 'Z', s: 10 + Math.floor(Math.random() * 5), x: R.x + 12 * sc, y: headY, vx: 8, vy: -14, life: 2 });
    if (S.energy >= 100) { gainXp(3); wake(false); }
  } else if (m === 'dizzy') {
    R.ox = Math.sin(R.t * 12) * 2;
    if (R.t > 1.8) { say('Uff… schwindlig'); idle(1.5); }
  } else if (m === 'refuse') {
    if (R.t > 1.8) idle(1);
  } else if (m === 'cheer') {
    if (R.t > 2.2) idle(1);
  }
}

// ---------- drawing ----------
function animFor() {
  const m = R.mode;
  if (R.sleeping || m === 'sleep') return 'sleep';
  if (m === 'dizzy') return 'dizzy';
  if (m === 'refuse') return 'shrug';
  if (m === 'eat') return R.t > .7 ? 'eat' : 'idle';
  if (m === 'play') return 'dance';
  if (m === 'clean') return 'spin';
  if (m === 'cheer') return 'celebrate';
  if (petting()) return 'pet';
  if (m === 'walk') return 'walk';
  if (R.happy > 0) return 'happy';
  if (R.greet > 0) return 'wave';
  return mood() === 'sad' ? 'sad' : 'idle';
}

function drawClawd(cam) {
  if (!R.sheet) return;
  const name = animFor(), mo = MANI.motions[name], sc = sz();
  if (name !== R.anim) { R.anim = name; R.animT0 = R.time; }
  const frame = Math.floor((((R.time - R.animT0) / mo.dur) % 1) * mo.frames);
  const dw = CELLW * K * sc, dh = CELLH * K * sc;
  const sx = R.x + R.ox - cam, fy = feetY() - R.hop;
  const baseY = fy - (MANI.ch - 6) * MANI.scale * K * sc;
  ctx.imageSmoothingEnabled = S.look !== 'pixel';
  ctx.save();
  ctx.translate(Math.round(sx), 0);
  if (R.look < 0) ctx.scale(-1, 1);
  ctx.drawImage(R.sheet, frame * CELLW, mo.row * CELLH, CELLW, CELLH, Math.round(-dw / 2), Math.round(baseY), Math.round(dw), Math.round(dh));
  ctx.restore();
  return { top: fy - 74 * sc - (name === 'celebrate' ? 14 : 0), sx };
}

function drawBug(b, cam) {
  icon('bug', b.x - cam, b.y + (Math.floor(b.ph) % 2), 16, b.dir < 0);
}

function drawParticles(cam) {
  for (const p of R.P) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    if (p.kind === 'heart') icon('heart', p.x - cam - 6, p.y - 6, 12);
    else if (p.kind === 'text') {
      ctx.font = fontStr(p.s); ctx.textBaseline = 'middle';
      ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1a2e'; ctx.strokeText(p.text, p.x - cam, p.y);
      ctx.fillStyle = '#f6f1e2'; ctx.fillText(p.text, p.x - cam, p.y);
    } else rect(p.x - cam, p.y, p.s, p.s, p.col);
  }
  ctx.globalAlpha = 1;
}

function drawBubble(c) {
  if (!R.say || !c) return;
  const u = ui(), size = 9, text = R.say.text;
  const w = textW(text, size) + 16, h = 20;
  const bx = clamp(c.sx - w / 2, 4, W - w - 4), by = Math.max(TOP + 4, c.top - h - 8);
  box(bx, by, w, h);
  // the tail points at Clawd
  const tx = clamp(c.sx, bx + 8, bx + w - 8);
  ctx.fillStyle = u.card; ctx.strokeStyle = STYLE().stroke || u.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(tx - 4, by + h - 1); ctx.lineTo(tx, by + h + 6); ctx.lineTo(tx + 4, by + h - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 4, by + h); ctx.lineTo(tx, by + h + 6); ctx.lineTo(tx + 4, by + h); ctx.stroke();
  ctx.fillStyle = u.card; ctx.fillRect(tx - 3, by + h - 2, 7, 3);
  txt(text, bx + w / 2, by + h / 2 + 1, { size, fill: u.ink, align: 'center' });
}

const barCol = v => v > 50 ? '#4cd964' : v > 25 ? '#ffcc00' : '#ff453a';
function drawHUD() {
  const u = ui();
  strip(0, TOP, W, 36);
  [['hunger', 'feed'], ['fun', 'play'], ['energy', 'sleep'], ['clean', 'clean']].forEach(([k, ic], i) => {
    const x = 5 + i * 58;
    icon(ic, x, TOP + 3, 13);
    rect(x + 16, TOP + 6, 36, 6, 'rgba(0,0,0,.5)');
    rect(x + 16, TOP + 6, 36 * S[k] / 100, 6, barCol(S[k]));
  });
  const st = stage(), days = Math.floor((Date.now() - S.born) / 864e5) + 1;
  txt(STAGES[st] + ' · Tag ' + days, 5, TOP + 25, { size: 8, halo: true });
  txt('v' + APP_VERSION + ' ' + R.storageTag, W - 5, TOP + 25, { size: 7, halo: true, align: 'right', alpha: .7 });
  const lo = XP_AT[st], hi = XP_AT[st + 1];
  rect(0, TOP + 34, W, 2, 'rgba(0,0,0,.45)');
  rect(0, TOP + 34, W * (hi ? clamp((S.xp - lo) / (hi - lo), 0, 1) : 1), 2, u.acc);
}

const ITEM_W = W / 5;
function drawMenu() {
  const u = ui();
  strip(0, MENU_Y, W, H - MENU_Y);
  const busy = !R.sleeping && busyNow();
  const labels = ['Essen', 'Spiel', R.sleeping ? 'Wecken' : 'Schlaf', 'Putzen', 'Welt'];
  for (let i = 0; i < 5; i++) {
    const x = i * ITEM_W, sel = i === R.sel;
    if (sel) { strip(x + 1, MENU_Y + 3, ITEM_W - 2, H - MENU_Y - 6, true); }
    txt(labels[i], x + ITEM_W / 2, MENU_Y + (H - MENU_Y) / 2, { size: 9, maxW: ITEM_W - 6, halo: true, align: 'center', alpha: busy ? .4 : sel ? 1 : .8 });
  }
}

const PANEL = { x: 12, y: 92, w: 216, h: 96 };
function drawPanel() {
  const u = ui(), p = PANEL;
  box(p.x, p.y, p.w, p.h);
  txt('Welt', p.x + p.w / 2, p.y + 15, { size: 10, fill: u.ink, align: 'center' });
  const rows = [['Ort', SCENE_DE[S.scene]], ['Stil', LOOK_DE[S.look] || S.look]];
  rows.forEach(([k, v], i) => {
    const y = p.y + 26 + i * 28, on = i === R.prow;
    if (on) { ctx.globalAlpha = .16; rect(p.x + 8, y, p.w - 16, 24, u.ink); ctx.globalAlpha = 1; rect(p.x + 8, y + 22, p.w - 16, 2, u.ink); }
    txt(k, p.x + 14, y + 6, { size: 7, fill: u.ink, alpha: on ? .9 : .55 });
    txt(on ? '‹  ' + v + '  ›' : v, p.x + p.w / 2, y + 14, { size: 10, fill: u.ink, align: 'center', alpha: on ? 1 : .6 });
  });
}

function draw() {
  const cam = camX(), u = ui();
  // scenery over the full height; its bottom row is stretched down to the screen edge
  if (R.bg) {
    ctx.imageSmoothingEnabled = S.look !== 'pixel';
    const iw = R.bg.naturalWidth, ih = R.bg.naturalHeight, k = iw / BGW, srcH = (BGH - BG_YOFF) * k;
    ctx.drawImage(R.bg, cam * k, BG_YOFF * k, W * k, srcH, 0, 0, W, BGH - BG_YOFF);
    if (BGH - BG_YOFF < H) ctx.drawImage(R.bg, cam * k, ih - 1, W * k, 1, 0, BGH - BG_YOFF - 1, W, H - (BGH - BG_YOFF) + 1);
  } else rect(0, 0, W, H, '#101018');

  const fy = feetY();
  for (const b of R.bugs) if (b.y < fy) drawBug(b, cam);
  const c = drawClawd(cam);
  for (const b of R.bugs) if (b.y >= fy) drawBug(b, cam);

  const sc = sz();
  if (R.mode === 'eat') {
    const t = R.t, b = t < .7 ? 0 : Math.floor((t - .7) / .4) + 1;
    if (b < 5) {
      const size = [26, 26, 18, 18, 10][b], my = fy - 44 * sc - size / 2;
      icon('feed', R.x - cam - size / 2, t < .7 ? 80 + (my - 80) * (t / .7) : my, size);
    }
  } else if (R.mode === 'play') {
    const T = .7, uu = (R.t % T) / T;
    icon('play', R.x - cam - 10, fy - 80 * sc - 20 - Math.sin(Math.PI * uu) * 58, 20);
  } else if (R.mode === 'clean') {
    rect(R.sweep - cam, floorY(), 3, MENU_Y - floorY(), 'rgba(255,255,255,.7)');
  }
  drawParticles(cam);
  drawAmbient(cam);
  drawBubble(c);

  if (R.dim > .01) { ctx.globalAlpha = R.dim; rect(0, 0, W, H, '#05060f'); ctx.globalAlpha = 1; }
  drawHUD();
  drawMenu();
  if (R.panel) drawPanel();
  if (!R.bg || !R.sheet || !ready) {
    rect(0, 130, W, 24, '#000'); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px ' + MONO;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText('Lade…', W / 2, 142); ctx.textAlign = 'left';
  }
}

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (ts - lastTs < 33) return;        // ~30 fps is plenty
  const dt = Math.min(.1, (ts - lastTs) / 1000); lastTs = ts;
  update(dt); draw();
}

// ---------- storage (Base64, UTF-8 safe, creationStorage first, localStorage mirror) ----------
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(get, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { const v = get(); if (v) return v; await sleepMs(100); }
  return get() || null;
}
let CS = null;
async function loadState() {
  // SDK objects arrive late on the device: poll up to 3 s there, hardly wait on desktop
  CS = await waitFor(() => window.creationStorage && window.creationStorage.plain, /Android/i.test(navigator.userAgent) ? 3000 : 250);
  R.storageTag = CS ? 'cs' : 'ls';
  let raw = null;
  try { if (CS) raw = await CS.getItem(KEY); } catch (e) {}
  if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
  if (raw) { try { return dec(raw); } catch (e) {} }
  return null;
}
let saveTimer = 0;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow() {
  if (!ready) return;
  S.last = Date.now();
  const s = enc(S);
  try { localStorage.setItem(KEY, s); } catch (e) {}
  try { if (CS) Promise.resolve(CS.setItem(KEY, s)).catch(() => {}); } catch (e) {}
}
setInterval(saveNow, 5000);
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

async function boot() {
  requestAnimationFrame(frame);
  loadWorld();                          // start fetching the default scenery right away
  try { document.fonts.load('bold 9px Monocraft'); } catch (e) {}
  ICACHE_RESET();
  const s = await loadState();
  if (s) {
    const num = (v, d) => (Number.isFinite(v) ? v : d);
    const el = clamp((Date.now() - num(s.last, Date.now())) / 1000, 0, 6 * 3600);
    // time away: slower decay, never below 15 so Clawd is only sad, never lost
    const off = (v, r) => Math.max(Math.min(v, 15), v - r * el * 0.6);
    S.hunger = off(clamp(num(s.hunger, 70), 0, 100), 0.016);
    S.fun = off(clamp(num(s.fun, 70), 0, 100), 0.014);
    S.clean = off(clamp(num(s.clean, 80), 0, 100), 0.011);
    S.energy = clamp(num(s.energy, 80), 0, 100);
    S.xp = Math.max(0, num(s.xp, 0));
    S.born = num(s.born, Date.now());
    if (SCENES.includes(s.scene)) S.scene = s.scene;
    if (LOOKS.some(l => l.name === s.look)) S.look = s.look;
    loadWorld();
    say(el > 1800 ? 'Du warst lange weg!' : 'Hallo wieder!', 2.5);
  } else {
    say('Hallo, ich bin Clawd!', 3);
  }
  ready = true; syncBugs(); saveNow();
}

// ---------- input ----------
const stepSel = d => { R.sel = (R.sel + d + 5) % 5; };
window.addEventListener('scrollUp', () => { if (R.panel) changeWorld(-1); else stepSel(-1); });
window.addEventListener('scrollDown', () => { if (R.panel) changeWorld(1); else stepSel(1); });
window.addEventListener('sideClick', () => {
  const n = performance.now();
  if (n - R.lastClick < 250) return;   // a double click arrives as two events ~50 ms apart
  R.lastClick = n;
  if (R.panel) { if (R.prow === 0) R.prow = 1; else closePanel(); return; }
  act(R.sel);
});
window.addEventListener('longPressStart', () => { if (R.panel) closePanel(); else R.hold = true; });
window.addEventListener('longPressEnd', () => { R.hold = false; });

function pos(e) {
  const t = (e.touches && e.touches[0]) || e, r = cv.getBoundingClientRect();
  return [(t.clientX - r.left) * W / r.width, (t.clientY - r.top) * H / r.height];
}
function down(e) {
  e.preventDefault();
  const [x, y] = pos(e);
  if (R.panel) {
    const p = PANEL;
    if (x < p.x || x > p.x + p.w || y < p.y || y > p.y + p.h) return closePanel();
    const row = Math.floor((y - p.y - 26) / 28);
    if (row === 0 || row === 1) { R.prow = row; changeWorld(x < W / 2 ? -1 : 1); }
    return;
  }
  if (y >= MENU_Y) { R.sel = clamp(Math.floor(x / ITEM_W), 0, 4); act(R.sel); return; }
  const sc = sz(), sx = R.x - camX();
  if (Math.abs(x - sx) < 40 * sc && y > feetY() - 84 * sc && y < feetY() + 6) {
    if (R.sleeping) wake(true); else R.touchPet = true;
  }
}
function up(e) { e.preventDefault(); R.touchPet = false; }
document.body.addEventListener('touchstart', down, { passive: false });
document.body.addEventListener('touchend', up, { passive: false });
document.body.addEventListener('touchcancel', up, { passive: false });
document.body.addEventListener('mousedown', down);
document.body.addEventListener('mouseup', up);

// shake -> dizzy (wakes a sleeping Clawd, grumpily)
function onAccel(d) {
  const x = d.tiltX ?? d.x ?? 0, y = d.tiltY ?? d.y ?? 0, z = d.tiltZ ?? d.z ?? 0;
  if (R.prev) R.jerk += Math.abs(x - R.prev[0]) + Math.abs(y - R.prev[1]) + Math.abs(z - R.prev[2]);
  R.prev = [x, y, z];
  if (R.jerk > 2.5 && R.shakeCool <= 0 && ready && !R.panel) {
    R.shakeCool = 4; R.jerk = 0;
    if (R.sleeping) wake(true);
    else if (R.mode === 'idle' || R.mode === 'walk') { S.fun = Math.min(100, S.fun + 5); setMode('dizzy'); }
  }
}
(async function initSensors() {
  try {
    const acc = await waitFor(() => window.creationSensors && window.creationSensors.accelerometer, 3000);
    if (acc && await acc.isAvailable()) acc.start(onAccel, { frequency: 30 });
  } catch (e) {}
})();

// desktop preview shim: arrows = wheel, Enter/Space = side click, H = hold (pet)
if (typeof window.PluginMessageHandler === 'undefined') {
  const map = { ArrowUp: 'scrollUp', ArrowLeft: 'scrollUp', ArrowDown: 'scrollDown', ArrowRight: 'scrollDown', Enter: 'sideClick', ' ': 'sideClick' };
  window.addEventListener('keydown', e => {
    if (map[e.key]) { e.preventDefault(); window.dispatchEvent(new Event(map[e.key])); }
    else if ((e.key === 'h' || e.key === 'H') && !e.repeat) window.dispatchEvent(new Event('longPressStart'));
  });
  window.addEventListener('keyup', e => { if (e.key === 'h' || e.key === 'H') window.dispatchEvent(new Event('longPressEnd')); });
}

boot();
</script>
