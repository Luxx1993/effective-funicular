<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Tally</title>
<style>
  html, body { margin: 0; width: 240px; height: 282px; overflow: hidden;
               background: #000; color: #fff; font: 14px system-ui, sans-serif;
               -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  #app { position: relative; box-sizing: border-box; width: 240px; height: 282px;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; padding: 8px; }
  #label { font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
           color: #FE5000; opacity: .9; }
  #count { font-size: 96px; line-height: 1.1; font-weight: 700; color: #fff;
           font-variant-numeric: tabular-nums; will-change: transform; }
  #count.pop { animation: pop .15s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  #flash { position: absolute; left: 0; top: 0; width: 240px; height: 282px;
           background: #FE5000; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  #ver { position: absolute; bottom: 6px; left: 0; width: 240px; text-align: center;
         font-size: 11px; opacity: .45; }
</style>
</head>
<body>
<div id="app">
  <div id="label">Coffee</div>
  <div id="count">0</div>
  <div id="flash"></div>
  <div id="ver"></div>
</div>
<script>
const APP_VERSION = '0.1.1';
const KEY = 'tally_state';
const $ = (id) => document.getElementById(id);
const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = (s) => JSON.parse(decodeURIComponent(escape(atob(s))));

let count = 0;
let dirty = false;
let mode = '-';   // shown in the version tag for on-device debugging

// Storage: creationStorage.plain (may be injected late), mirrored to localStorage
const cs = () => (window.creationStorage && window.creationStorage.plain) || null;
const unwrap = (raw) => {
  if (raw && typeof raw === 'object') raw = raw.value !== undefined ? raw.value : null;
  return typeof raw === 'string' && raw ? dec(raw) : null;
};
const store = {
  async get() {
    for (let i = 0; i < 15 && !cs(); i++) await new Promise((r) => setTimeout(r, 100));
    let v = null;
    try { if (cs()) { v = unwrap(await cs().getItem(KEY)); if (v) mode = 'cs'; } } catch (e) {}
    if (!v) { try { v = unwrap(localStorage.getItem(KEY)); if (v) mode = 'ls'; } catch (e) {} }
    if (!v) mode = cs() ? 'cs0' : 'ls0';
    return v;
  },
  async set(v) {
    const e = enc(v);
    try { localStorage.setItem(KEY, e); } catch (x) {}
    try { if (cs()) await cs().setItem(KEY, e); } catch (x) {}
  }
};

let saveTimer = null;
function flush() { clearTimeout(saveTimer); saveTimer = null; store.set({ count }); }
function scheduleSave() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 300);
}
window.addEventListener('pagehide', () => { if (saveTimer) flush(); });
document.addEventListener('visibilitychange', () => { if (saveTimer) flush(); });

function restart(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function render(animate) {
  $('count').textContent = String(count);
  if (animate) restart($('count'), 'pop');
}

function change(delta) {
  const next = Math.max(0, count + delta);
  if (next === count) return;
  count = next;
  render(true);
  scheduleSave();
}

function reset() {
  count = 0;
  render(false);
  restart($('flash'), 'on');
  scheduleSave();
}

window.addEventListener('scrollUp',   () => change(1));
window.addEventListener('scrollDown', () => change(-1));
window.addEventListener('sideClick',  () => change(1));
window.addEventListener('longPressStart', reset);
document.body.addEventListener('touchstart', (e) => {
  e.preventDefault();
  change(1);
}, { passive: false });

// Desktop preview shim (no-op on the device)
if (typeof PluginMessageHandler === 'undefined') {
  window.addEventListener('keydown', (e) => {
    const map = { ArrowUp: 'scrollUp', ArrowDown: 'scrollDown', Enter: 'sideClick', r: 'longPressStart', R: 'longPressStart' };
    if (map[e.key]) { e.preventDefault(); window.dispatchEvent(new Event(map[e.key])); }
  });
}

const showVer = () => { $('ver').textContent = 'v' + APP_VERSION + ' ' + mode; };
showVer();
render(false);
store.get().then((st) => {
  if (st && Number.isInteger(st.count) && st.count >= 0 && !dirty) { count = st.count; render(false); }
  showVer();
});
</script>
</body>
</html>
